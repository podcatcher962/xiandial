<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1C1F">
<title>拾声 · 声音里的戏园子</title>
<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D; --acc:#4A9EFF; --acc2:#7CBDFF;
  --ok:#3FC08A; --warn:#E8A33D; --dan:#E2685F;
  --wood1:#5C3F2B; --wood2:#3D2A1C; --wood3:#2C1E13;
  --grille:#12100E; --dial:#C9B79A; --glow:rgba(232,163,61,.55);
  --ui:1; --tap:38px; --r:12px;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#EDEFF2; --line:#D7DADF;
  --tx:#1D1F23; --tx2:#5E646C; --acc:#1668C4; --acc2:#0F4E96;
  --ok:#1E8A5F; --warn:#9A6410; --dan:#B33A31;
  --wood1:#C9A67E; --wood2:#A98960; --wood3:#8A6C46;
  --grille:#5B4633; --glow:rgba(154,100,16,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:calc(15px * var(--ui)); line-height:1.65;
  padding-bottom:calc(138px + env(safe-area-inset-bottom));
}
html[data-motion="low"] *{animation:none !important;transition:none !important}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}

/* ---------- 机身外壳 ---------- */
.shell{
  position:relative; overflow:hidden;
  background:
    repeating-linear-gradient(88deg, rgba(0,0,0,.16) 0 1px, rgba(255,255,255,.025) 1px 3px, rgba(0,0,0,.05) 3px 6px),
    linear-gradient(170deg, var(--wood1), var(--wood2) 58%, var(--wood3));
  border-bottom:3px solid rgba(0,0,0,.45);
  box-shadow:0 6px 22px rgba(0,0,0,.45);
  padding:14px 16px 12px;
}
.shell::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%, rgba(0,0,0,.22));
}
.brand{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;position:relative;z-index:2;padding-right:44px}
.brand h1{
  margin:0;font-size:calc(23px * var(--ui));letter-spacing:.16em;font-weight:700;
  color:#F5EEE4;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 14px rgba(255,220,170,.18);
}
.brand .sub{font-size:calc(12px * var(--ui));color:rgba(245,238,228,.62);letter-spacing:.08em}
.brand .gear{
  position:absolute;right:0;top:2px;
  width:var(--tap);height:var(--tap);min-width:var(--tap);
  border-radius:9px;border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.22);color:#F5EEE4;font-size:calc(17px * var(--ui));
}
.brand .gear:active{background:rgba(0,0,0,.4)}

/* 扬声器网 + 调频窗 */
.panel{display:flex;gap:14px;align-items:stretch;margin-top:11px;position:relative;z-index:2;flex-wrap:wrap}
.grille{
  flex:1 1 150px;min-width:130px;height:64px;border-radius:8px;
  background-color:var(--grille);
  background-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.75) 32%, rgba(255,255,255,.05) 34%, transparent 40%);
  background-size:7px 7px;
  border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 2px 9px rgba(0,0,0,.85);
  position:relative;
}
.grille .vu{
  position:absolute;left:0;right:0;bottom:0;height:100%;
  display:flex;align-items:flex-end;gap:3px;padding:7px 9px;opacity:0;transition:opacity .3s;
}
body.playing .grille .vu{opacity:1}
.grille .vu i{
  flex:1;background:linear-gradient(0deg,var(--ok),var(--warn));border-radius:2px;height:22%;
  animation:vu 1.1s ease-in-out infinite;
}
.grille .vu i:nth-child(2){animation-duration:.83s}
.grille .vu i:nth-child(3){animation-duration:1.34s}
.grille .vu i:nth-child(4){animation-duration:.72s}
.grille .vu i:nth-child(5){animation-duration:1.05s}
.grille .vu i:nth-child(6){animation-duration:.94s}
.grille .vu i:nth-child(7){animation-duration:1.22s}
.grille .vu i:nth-child(8){animation-duration:.66s}
@keyframes vu{0%,100%{height:14%}50%{height:84%}}

.tuner{
  flex:1 1 260px;min-width:220px;height:64px;border-radius:8px;
  background:linear-gradient(180deg,#E8DFC8,#CDBFA0);
  border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 3px 12px rgba(0,0,0,.42);
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  padding:0 12px;
}
html[data-theme="light"] .tuner{background:linear-gradient(180deg,#FBF6E9,#E4D9BE)}
.tuner .band{
  height:22px;position:relative;
  background:repeating-linear-gradient(90deg, rgba(60,45,25,.62) 0 1px, transparent 1px 11px);
  border-bottom:1px solid rgba(60,45,25,.35);
}
.tuner .band::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:6px;
  background:repeating-linear-gradient(90deg, rgba(60,45,25,.85) 0 1px, transparent 1px 55px);
}
.tuner .needle{
  position:absolute;top:0;bottom:26px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--dan),#8E1F18);
  box-shadow:0 0 9px var(--glow), 0 0 3px rgba(255,120,90,.9);
  transition:left .55s cubic-bezier(.3,.9,.3,1);left:6%;
}
.tuner .read{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:3px}
.tuner .freq{font:700 calc(15px * var(--ui))/1 ui-monospace,Consolas,monospace;color:#3A2A14;letter-spacing:.04em}
.tuner .nm{font-size:calc(12px * var(--ui));color:#4E3A20;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.tuner .lamp{
  width:9px;height:9px;border-radius:50%;background:#6B2A22;box-shadow:inset 0 0 3px rgba(0,0,0,.6);align-self:center;
}
body.playing .tuner .lamp{background:var(--dan);box-shadow:0 0 10px var(--glow),inset 0 0 2px #fff}

/* ---------- 导航 ---------- */
nav{
  display:flex;gap:6px;padding:9px 12px;overflow-x:auto;
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:7px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.03em;
  color:var(--tx2);border:1px solid transparent;min-height:var(--tap);
  display:inline-flex;align-items:center;
}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button:not(.on):hover{background:var(--card2);color:var(--tx)}

main{padding:14px 14px 22px;max-width:1080px;margin:0 auto}
@media(max-width:430px){
  nav{gap:4px;padding:8px 9px}
  nav button{padding:7px 6px;letter-spacing:.03em;font-size:calc(14px * var(--ui))}
  .shell{padding:11px 12px 10px}
  .grille{flex:0 0 66px;height:56px}
  .tuner{flex:1 1 auto;min-width:0;height:56px;padding:0 9px}
  .tuner .nm{max-width:50%}
  .tuner .freq{font-size:calc(13.5px * var(--ui))}
  #bar .volbox{margin-left:auto}
  #bar .now{flex:1 1 120px}
}

/* ---------- 通用 ---------- */
h2{font-size:calc(17px * var(--ui));margin:0 0 4px;letter-spacing:.06em}
h3{font-size:calc(15px * var(--ui));margin:18px 0 6px;color:var(--acc2)}
p{margin:7px 0;color:var(--tx2)}
.hint{font-size:calc(13px * var(--ui));color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chips{display:flex;gap:7px;margin:9px 0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
/* 分类条：网格铺满整行，不浪费右侧空间，所有选项一眼可见 */
.chips.grid{
  display:grid;gap:7px;margin:9px 0;overflow:visible;padding:0;
  /* auto-fill：条目少的时候也不会被撑满一整行（auto-fit 会把空轨道折算掉） */
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
/* 历史条目：台名有长有短，允许折行，别把字挤出去 */
#histChips{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
#histChips .chip{white-space:normal;line-height:1.3;padding:8px 11px}
.chips.grid .chip{flex:none;width:100%;min-width:0;justify-content:center}
#catChips{grid-template-columns:repeat(auto-fit,minmax(122px,1fr))}
#provChips{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));row-gap:6px;
           margin-top:4px;padding-top:9px;border-top:1px dashed var(--line)}
#provChips .chip{padding:5px 8px;font-size:.92em;min-height:calc(30px * var(--ui))}
.chip{
  flex:0 0 auto;white-space:nowrap;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);min-height:var(--tap);
  display:inline-flex;align-items:center;gap:5px;
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .cn{opacity:.6;font-size:.86em}
.btn{
  padding:10px 16px;border-radius:9px;background:var(--acc);color:#fff;
  min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:#1B1C1F}
.btn.dan{background:var(--dan);color:#fff}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
/* 收藏分组（收藏超过 12 个才出现） */
.grp{margin:0 0 14px}
.grp .ghd{margin:0 0 7px;display:flex;align-items:center;gap:7px}
.grp .ghd h3{margin:0;font-size:calc(13.5px * var(--ui));color:var(--tx2);font-weight:600;letter-spacing:.4px}
.grp .ghd h3::before{content:"";display:inline-block;width:3px;height:12px;border-radius:2px;
  background:var(--acc);margin-right:7px;vertical-align:-1px}
.grp .ghd .cn{font-size:calc(11.5px * var(--ui));color:var(--tx2);opacity:.7}
.grp .stgrid{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.st{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
  min-height:calc(72px * var(--ui));transition:border-color .18s,transform .12s;
  cursor:pointer;position:relative;
}
.st:hover{border-color:var(--acc)}
.st:active{transform:scale(.985)}
.st:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.st.cur{border-color:var(--dan);background:var(--card2);box-shadow:0 0 0 1px var(--dan) inset}
.st .r1{display:flex;gap:6px;align-items:flex-start}
.st .n{font-size:calc(15px * var(--ui));font-weight:600;line-height:1.35;flex:1 1 auto;min-width:0}
.favb{
  flex:0 0 auto;width:calc(28px * var(--ui));height:calc(28px * var(--ui));margin:-3px -4px 0 0;
  border-radius:8px;background:transparent;border:1px solid transparent;
  color:var(--tx2);font-size:calc(15px * var(--ui));line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  position:relative;
}
/* 星标看着不大，热区撑到 44px，手指按得中（不越出卡片） */
.favb::after{
  content:"";position:absolute;left:50%;top:50%;
  width:calc(44px * var(--ui));height:calc(44px * var(--ui));
  transform:translate(-50%,-50%);
}
.favb:hover{border-color:var(--line);background:var(--card2)}
.favb.on{color:var(--warn)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.hd h3{margin:0}
.st .m{font-size:calc(11.5px * var(--ui));color:var(--tx2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tagc{
  font-size:calc(10.5px * var(--ui));padding:1px 7px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);
}
.st.cur .tagc{background:rgba(226,104,95,.16);border-color:var(--dan);color:var(--dan)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.f{background:var(--dan)}
.dot.h{background:var(--warn)}

/* ---------- 底部播放条 ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,var(--card),var(--bg));
  border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.35);
}
#bar .wrap{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar .now{flex:1 1 190px;min-width:150px;overflow:hidden}
#bar .now .t{font-size:calc(14px * var(--ui));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .now .s{font-size:calc(11.5px * var(--ui));color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{
  width:52px;height:52px;min-width:52px;border-radius:50%;
  background:var(--dan);color:#fff;font-size:21px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.4);
}
.big:active{transform:scale(.95)}
.knob{
  width:46px;height:46px;min-width:46px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #55595F, #26282C 70%);
  border:1px solid #14161A;position:relative;
  box-shadow:0 2px 7px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
}
.knob::after{
  content:"";position:absolute;left:50%;top:5px;width:2px;height:13px;margin-left:-1px;
  background:var(--acc2);border-radius:2px;transform-origin:50% 18px;
  transform:rotate(var(--rot,0deg));transition:transform .2s;
}
.knob:active{filter:brightness(1.2)}
.favk{
  width:44px;height:44px;min-width:44px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);
  font-size:calc(18px * var(--ui));line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.favk:hover{border-color:var(--acc)}
.favk:active{transform:scale(.94)}
.favk.on{color:var(--warn);border-color:var(--warn)}
.volbox{display:flex;align-items:center;gap:7px}
.volmeter{width:56px;height:6px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.volmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn));width:60%;transition:width .2s}
#sleepBadge{
  font-size:calc(11.5px * var(--ui));color:var(--warn);border:1px dashed var(--warn);
  border-radius:7px;padding:4px 8px;white-space:nowrap;
}
/* 录音 */
.favk.rec{color:#fff;background:var(--dan);border-color:var(--dan);animation:recblink 1.5s ease-in-out infinite}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.42}}
#recBadge{
  font-size:calc(11.5px * var(--ui));color:#fff;background:var(--dan);
  border-radius:7px;padding:4px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;
}
@media(prefers-reduced-motion:reduce){.favk.rec{animation:none}}

/* ---------- 弹出面板 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:520px;max-height:88vh;overflow:auto;z-index:61;
  background:var(--card);border:1px solid var(--line);border-bottom:none;
  border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:none;
}
.sheet.on{display:block}
.sheet h3{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.seg button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);min-height:var(--tap)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stack{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card2)}
.lrow .g{flex:1;min-width:0}
.lrow .g .t{font-size:calc(14px * var(--ui));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .g .s{font-size:calc(11.5px * var(--ui));color:var(--tx2)}
input[type=text],input[type=url],textarea{
  width:100%;padding:10px 12px;border-radius:9px;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);font-family:inherit;font-size:calc(14px * var(--ui));min-height:var(--tap);
}
textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:calc(12.5px * var(--ui))}
label.f{display:block;font-size:calc(13px * var(--ui));color:var(--tx2);margin:11px 0 4px}
ol,ul{padding-left:1.3em;color:var(--tx2)}
li{margin:4px 0}
code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:.92em;color:var(--acc2)}
table{width:100%;border-collapse:collapse;margin:9px 0;font-size:calc(13.5px * var(--ui))}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--card2);color:var(--tx)}
.ft{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);color:var(--tx2);font-size:calc(12.5px * var(--ui));text-align:center}
.ft b{color:var(--tx);letter-spacing:.06em}
.qa{border-bottom:1px solid var(--line);padding:11px 0}
.qa:last-child{border-bottom:none}
.qa .q{font-weight:600;color:var(--tx);margin-bottom:3px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.qa .q .ar{color:var(--acc);flex:0 0 auto}
.qa .a{color:var(--tx2);display:none;padding-left:20px}
.qa.on .a{display:block}
.badge{display:inline-block;font-size:calc(11px * var(--ui));padding:1px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);margin-left:6px}
.warnbox{border-left:3px solid var(--warn);background:rgba(232,163,61,.08);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.danbox{border-left:3px solid var(--dan);background:rgba(226,104,95,.08);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.drop{
  border:1.5px dashed var(--line);border-radius:11px;padding:20px;text-align:center;color:var(--tx2);
  background:var(--card2);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.drop.over{border-color:var(--acc);color:var(--acc)}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* 窄屏网格覆盖 —— 必须放在样式表最末，否则被上面的基础 .stgrid 覆盖 */
@media(max-width:430px){
  .stgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
  .st{padding:10px 11px;min-height:calc(66px * var(--ui))}
  .st .n{font-size:calc(14.5px * var(--ui))}
  .favk{width:40px;height:40px;min-width:40px}
}
/* 搜索框 */
.qbox{display:flex;align-items:center;gap:9px;margin:11px 0 2px;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:0 11px}
.qbox .qi{opacity:.5;font-size:calc(17px * var(--ui));line-height:1}
.qbox input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--tx);
  font-size:calc(15px * var(--ui));padding:11px 0;font-family:inherit}
.qbox input::placeholder{color:var(--tx2);opacity:.75}
.qbox input::-webkit-search-cancel-button{display:none}
.qbox .qclear{background:transparent;border:0;color:var(--tx2);font-size:calc(14px * var(--ui));
  cursor:pointer;padding:8px;line-height:1;min-width:32px}
.qbox .qclear.hide{display:none}
</style>
</head>
<body>

</div>

<!-- ══════════ 机身外壳 ══════════ -->
<header class="shell">
  <div class="brand">
    <h1>拾声</h1>
    <div class="sub">声音里的戏园子 · 听戏 · 听书 · 听旧时光</div>
    <button class="gear" id="btnGear" title="设置" aria-label="设置">⚙</button>
  </div>
  <div class="panel">
    <div class="grille" aria-hidden="true">
      <div class="vu"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="tuner">
      <div class="band"></div>
      <div class="needle" id="needle"></div>
      <div class="read">
        <span class="lamp"></span>
        <span class="freq" id="tunerFreq">--.- MHz</span>
        <span class="nm" id="tunerName">待开机</span>
      </div>
    </div>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<!-- ══════════ 播放条 ══════════ -->
<div id="bar">
  <div class="wrap">
    <button class="knob" id="knobPrev" title="上一台" aria-label="上一台"></button>
    <button class="big" id="btnPlay" title="开机 / 暂停" aria-label="播放或暂停">▶</button>
    <button class="knob" id="knobNext" title="下一台" aria-label="下一台"></button>
    <div class="now">
      <div class="t" id="nowT">还没有选台</div>
      <div class="s" id="nowS">点上面任意一个戏台，就能开声了</div>
    </div>
    <button class="favk" id="btnFav" title="收藏这个台" aria-label="收藏这个台" style="display:none">☆</button>
    <button class="favk" id="btnRec" title="把正在听的录下来" aria-label="录音" style="display:none">⏺</button>
    <span id="recBadge" style="display:none"></span>
    <span id="sleepBadge" style="display:none"></span>
    <div class="volbox">
      <button class="chip" id="btnVolDown" aria-label="音量减小">−</button>
      <div class="volmeter"><i id="volMeter"></i></div>
      <button class="chip" id="btnVolUp" aria-label="音量增大">＋</button>
    </div>
  </div>
</div>

<!-- ══════════ 设置面板 ══════════ -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>设置</h3>
  <label class="f">外观</label>
  <div class="seg" id="segTheme">
    <button data-th="dark">深色</button>
    <button data-th="light">浅色</button>
    <button data-th="system">跟随系统</button>
  </div>
  <label class="f">字大小</label>
  <div class="seg" id="segUi">
    <button data-ui="0.9">标准</button>
    <button data-ui="1.05">大</button>
    <button data-ui="1.2">特大</button>
    <button data-ui="1.35">巨大</button>
  </div>
  <label class="f">按钮大小</label>
  <div class="seg" id="segTap">
    <button data-tap="38">普通</button>
    <button data-tap="48">大</button>
  </div>
  <label class="f">动效</label>
  <div class="seg" id="segMotion">
    <button data-mo="full">正常</button>
    <button data-mo="low">减弱</button>
  </div>
  <label class="f">定时关机（睡觉听戏用）</label>
  <div class="seg" id="segSleep">
    <button data-sl="0">不定时</button>
    <button data-sl="15">15 分</button>
    <button data-sl="30">30 分</button>
    <button data-sl="60">1 小时</button>
    <button data-sl="90">1.5 小时</button>
    <button data-sl="-1">播完就停</button>
  </div>
  <p class="hint" style="margin:-4px 0 4px">到点前 20 秒会把音量慢慢收下去，不会被突然掐断。选「播完就停」只对「拾藏」里自己存的戏有效。</p>
  <label class="f">录音时长</label>
  <div class="seg" id="segRec">
    <button data-rc="0">不定时</button>
    <button data-rc="15">15 分</button>
    <button data-rc="30">30 分</button>
    <button data-rc="60">1 小时</button>
    <button data-rc="-1">跟着关机停</button>
  </div>
  <p class="hint" style="margin:-4px 0 4px">听的时候按底栏的 <b>⏺</b> 就开始录，录完自动收进「拾藏 · 录音」，随时能回听。选「跟着关机停」——定时关机一到，录音也跟着停好存上，睡着听的那段不会丢。</p>
  <label class="f">打开后自动续播上次的台</label>
  <div class="seg" id="segResume">
    <button data-rs="1">开</button>
    <button data-rs="0">关</button>
  </div>
  <label class="f">换台时自动跳过连不上的台</label>
  <div class="seg" id="segSkip">
    <button data-sk="1">开</button>
    <button data-sk="0">关</button>
  </div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" id="btnExport">导出备份</button>
    <button class="btn ghost" id="btnImport">恢复备份</button>
    <button class="btn ghost" id="btnReset">清空数据</button>
  </div>
  <p class="hint" style="margin-top:10px">所有收藏、自建台、音量与设置都存在这台设备的浏览器里，不会上传到任何服务器。</p>
</div>

<input type="file" id="fileImportJson" accept=".json" style="display:none">
<input type="file" id="fileAudio" accept="audio/*" multiple style="display:none">
<input type="file" id="fileAudioDir" webkitdirectory directory multiple style="display:none">

/* 一个台可同时属于省份与功能两类，故用 g 数组判断 */
function inCat(x,c){
  if(c==='全部') return true;
  if(c==='自建') return !!x.custom;
  if(c==='收藏') return isFav(x.u);
  var g=x.g||[x.c];
  if(c==='地方台'){
    for(var i=0;i<PROVS.length;i++){ if(g.indexOf(PROVS[i])>=0) return true; }
    return false;
  }
  return g.indexOf(c)>=0;
}
function inProv(x,p){
  if(!p||p==='全国') return true;
  return (x.g||[x.c]).indexOf(p)>=0;
}

var S={
  theme:'dark', ui:1, tap:38, motion:'full',
  vol:0.7, sleepMin:0, resume:1, skip:1, recMin:0,
  cur:null, fav:[], custom:[], hist:[], lastCat:'全部', lastProv:'全国'
};

function load(){
  try{
    var o=JSON.parse(localStorage.getItem(KEY)||'{}');
    for(var k in o){ if(o.hasOwnProperty(k)) S[k]=o[k]; }
  }catch(e){}
  if(S.fav==null) S.fav=[];
  if(S.custom==null) S.custom=[];
  if(S.hist==null) S.hist=[];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* 全部台 = 内置 + 自建 */
function allStations(){
  var a=STATIONS.slice();
  for(var i=0;i<S.custom.length;i++){
    var c=S.custom[i];
    a.unshift({n:c.n, u:c.u, c:c.c||'自建', custom:true});
  }
  return a;
}
function byUrl(u){
  var a=allStations();
  for(var i=0;i<a.length;i++){ if(a[i].u===u) return a[i]; }
  return null;
}
function isFav(u){ return S.fav.indexOf(u)>=0; }

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtSize(b){
  if(b==null) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
/* 文件名里不能出现的字符，替换成下划线，免得下载时被系统拦下 */
function safeFn(s){ return String(s||'audio').replace(/[\\/:*?"<>|]/g,'_').slice(0,120); }
function fmtTime(s){
  if(!isFinite(s)||s<0) return '0:00';
  s=Math.floor(s);
  var m=Math.floor(s/60), ss=s%60;
  if(m<60) return m+':'+(ss<10?'0':'')+ss;
  return Math.floor(m/60)+':'+(m%60<10?'0':'')+(m%60)+':'+(ss<10?'0':'')+ss;
}
function toast(msg, ms){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;'+
    'background:rgba(0,0,0,.86);color:#fff;padding:10px 18px;border-radius:10px;'+
    'font-size:calc(13.5px * var(--ui));max-width:86vw;text-align:center;pointer-events:none';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, ms||2200);
}

/* 反向表：汉字 → 全拼（首次用到时建好，避免每次搜索重扫） */
var FPX=null;
function fullPy(str){
  if(!str) return '';
  if(!FPX){ FPX={}; for(var k in FP){ var cs=FP[k]; for(var i=0;i<cs.length;i++) FPX[cs.charAt(i)]=k; } }
  var out='';
  for(var j=0;j<str.length;j++){
    var c=str.charAt(j), p=FPX[c];
    out += (p || c.toLowerCase());
  }
  return out.replace(/[^a-z0-9]/g,'');
}

function pyOf(str){
  if(!str) return '';
  var out='';
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i), p=PY[c];
    out += (p || c.toLowerCase());
  }
  return out.replace(/[^a-z0-9]/g,'');
}

/* 该 URL 是不是 HLS（m3u8） */
function isHls(u){ return /\.m3u8(\?|$)/i.test(u); }
/* 浏览器是否原生支持 HLS（Edge / Safari 支持；安卓 Chrome 不支持） */
var HLS_NATIVE=(function(){
  try{ return document.createElement('audio').canPlayType('application/vnd.apple.mpegurl')!==''; }
  catch(e){ return false; }
})();

/* 换台时试的线路变体：蜻蜓 CDN 有 lhttp / lhttp-hw 两套域名，去掉签名参数也能通 */
function variants(u){
  var out=[u];
  var noQ=u.replace(/\?.*$/,'');
  if(noQ!==u) out.push(noQ);
  if(u.indexOf('lhttp-hw.')>=0) out.push(u.replace('lhttp-hw.','lhttp.'));
  if(u.indexOf('lhttp.')>=0 && u.indexOf('lhttp-hw.')<0) out.push(u.replace('lhttp.','lhttp-hw.'));
  if(u.indexOf('https://')===0) out.push('http://'+u.slice(8));
  if(u.indexOf('http://')===0) out.push('https://'+u.slice(7));
  var uniq=[];
  for(var i=0;i<out.length;i++){ if(uniq.indexOf(out[i])<0) uniq.push(out[i]); }
  return uniq;
}

/* 手机锁屏 / 通知栏显示台名，支持耳机线控与锁屏按钮 */
function setMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    var art=[];
    var im=document.getElementById('spImg');
    if(im && im.src) art=[{src:im.src, sizes:'1080x1920', type:'image/jpeg'}];
    navigator.mediaSession.metadata=new MediaMetadata({
      title: P.name || '拾声',
      artist: (P.cat ? P.cat + ' · ' : '') + '拾声 XianDial',
      album: '拾声 · 网络收音机',
      artwork: art
    });
    navigator.mediaSession.setActionHandler('play', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){
      try{ audio.pause(); }catch(e){} P.state='paused'; setNow(); render();
    });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ step(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ step(1); });
    navigator.mediaSession.setActionHandler('stop', function(){
      stopAudio(); P.state='idle'; P.url=null; setNow(); render();
    });
  }catch(e){}
}
/* 底部播放条上的星标：亮不亮、显不显，都看当前这个台在不在收藏里 */
function syncFavBtn(){
  var fb=$('btnFav');
  if(!fb) return;
  var canFav=!!P.url && P.url.indexOf('local:')!==0;   // 「拾藏」里的音频不参与收藏

function setNeedle(){
  var a=allStations(), i=0;
  for(var k=0;k<a.length;k++){ if(a[k].u===P.url){ i=k; break; } }

/* ══ HLS 播放引擎 ══
   内嵌了 hls.js，所以安卓 Chrome 等不原生支持 HLS 的浏览器也能播 m3u8
   （央视/卫视伴音、部分省市台）。Edge / Safari 原生支持，走原路更快。*/
var hls=null;
function hlsStop(){
  if(hls){ try{ hls.destroy(); }catch(e){} hls=null; }
}
function hlsStart(url, onFail){
  if(typeof Hls==='undefined' || !Hls.isSupported()) return false;
  hlsStop();
  try{
    hls=new Hls({
      enableWorker:true, lowLatencyMode:false, backBufferLength:30,
      manifestLoadingTimeOut:9000, levelLoadingTimeOut:9000, fragLoadingTimeOut:14000,
      manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2, fragLoadingMaxRetry:3
    });
    hls.attachMedia(audio);
    hls.on(Hls.Events.MEDIA_ATTACHED, function(){ try{ hls.loadSource(url); }catch(e){ onFail(); } });
    hls.on(Hls.Events.ERROR, function(ev, d){ if(d && d.fatal) onFail(); });
    return true;
  }catch(e){ hlsStop(); return false; }
}
function stopAudio(){
  hlsStop();
  try{ audio.pause(); audio.removeAttribute('src'); audio.load(); }catch(e){}
}

function playStation(st, opts){
  opts=opts||{};
  if(!st) return;
  if(REC.on && P.url && P.url!==st.u) recStopIfPlaying();   // 换台了，把刚才那段先收好
  if(P.retryTimer){ clearTimeout(P.retryTimer); P.retryTimer=null; }
  if(isHls(st.u) && !HLS_NATIVE && typeof Hls==='undefined'){
    toast('这个台是 HLS 流，当前浏览器播不了。请换一个台，或用 Edge / Safari 打开。', 4200);
  }
  P.url=st.u; P.name=st.n; P.cat=st.c||'';
  P.vs=variants(st.u); P.vi=0; P.state='loading';
  S.cur={u:st.u, n:st.n, c:st.c||''};
  if(!opts.noSave) save();
  setNeedle(); setNow(); render();
  tryPlay();
  if(st.hist!==false) pushHist(st);
}

function tryPlay(){
  var url=P.vs[P.vi];
  if(!url){ P.state='error'; setNow(); toast('这个台连不上，换一个试试'); nextStation(); return; }
  stopAudio();
  audio.volume=S.vol;
  var viaHls=(isHls(url) && !HLS_NATIVE && hlsStart(url, fail));
  if(!viaHls){ audio.src=url; }
  var done=false;
  function fail(){
    if(done) return; done=true;
    audio.removeEventListener('error',onErr);
    P.vi++;
    if(P.vi<P.vs.length){ tryPlay(); }
    else{
      // 所有线路都试过了：先「原地重试」两次（很多是瞬时抖动），再交给自动跳台
      if(P.inRetry<2){
        P.inRetry++;
        P.state='loading'; setNow(); render();
        $('nowS').textContent='信号断了，正在重新接线（第 '+P.inRetry+' 次）……';
        P.retryTimer=setTimeout(function(){ P.vi=0; tryPlay(); }, 1600);
        return;
      }
      P.state='error'; P.inRetry=0; setNow(); render();
      if(S.skip && P.failCount<4){ P.failCount++; P.retryTimer=setTimeout(function(){ nextStation(); }, 900); }
      else{ P.failCount=0; toast('这个台暂时连不上，声音可能已经断了，请换一个台'); }
    }
  }
  function onErr(){ fail(); }
  if(!viaHls){ audio.addEventListener('error', onErr, {once:true}); }
  var pr=audio.play();
  if(pr && pr.catch){ pr.catch(function(e){ if(e && e.name!=='AbortError') fail(); }); }
  setTimeout(function(){
    if(done) return;
    if(audio.readyState>=2){ done=true; audio.removeEventListener('error',onErr);
      P.state='playing'; P.failCount=0; P.inRetry=0; P.lastPlay=Date.now(); setNow(); render(); }
  }, 1200);
}

/* ══ 听着听着断了：不用重新点，自己接回去 ══
   只有「正在播的时候断」才管（用户自己按暂停不算）；最多接 4 次，间隔 1.5s / 3s / 6s / 12s。
   接不上就退回自动跳台，或者提示换台。 */
var DC={timer:null, tries:0};
function dcClear(){ if(DC.timer){ clearTimeout(DC.timer); DC.timer=null; } DC.tries=0; }
function dcRetry(){
  if(DC.tries>=4){
    dcClear();
    toast('这个台接不回去了，换一个试试');
    $('nowS').textContent='信号断了，接不回去';
    if(S.skip) nextStation();
    return;
  }
  var wait=[1500,3000,6000,12000][DC.tries] || 12000;
  DC.tries++;
  P.state='loading'; setNow();
  $('nowS').textContent='信号断了，正在接回去（第 '+DC.tries+' 次）……';
  DC.timer=setTimeout(function(){
    if(!P.url){ dcClear(); return; }
    P.vi=0; P.inRetry=0;
    tryPlay();
    /* 接上没接上，交给 tryPlay 的 fail/成功回调处理；
       这里再挂一个观察：过 3 秒还没回到 playing 就再试 */
    setTimeout(function(){
      if(P.state!=='playing' && P.state!=='idle' && P.state!=='paused') dcRetry();
    }, 3000);
  }, wait);
}
audio.addEventListener('playing', function(){
  P.state='playing'; P.failCount=0; P.inRetry=0; P.lastPlay=Date.now(); dcClear(); setNow(); render();
});
audio.addEventListener('pause', function(){ if(P.state==='playing'){ P.state='paused'; setNow(); render(); } });
audio.addEventListener('stalled', function(){ if(P.state==='playing'){ $('nowS').textContent='信号有点弱，正在缓冲……'; } });
/* 播放中出错 / 无声：触发自动重连 */
audio.addEventListener('error', function(){
  if(P.state==='playing' && P.url){ dcRetry(); }
});
audio.addEventListener('ended', function(){
  /* 「播完就停」：本地音轨放完就关机 */
  if(P.url && P.url.indexOf('local:')===0){
    if(S.sleepMin<0){
      stopAudio(); P.state='idle'; P.url=null; setNow(); render();
      S.sleepMin=0; save(); $('sleepBadge').style.display='none';
      toast('这一段落放完了，自己关机了');
      return;
    }
    /* 本地库里的音频放完了，默认接着放下一段 */
    if(LOCALS && LOCALS.length>1) localNext();
    return;
  }
  if(P.url && P.state==='playing'){ dcRetry(); }
});

function togglePlay(){
  if(P.state==='playing'){ audio.pause(); P.state='paused'; setNow(); render(); return; }
  // 恢复了上次的台但还没接线（src 为空）：重新接一次
  if(P.state==='paused' && P.url && audio.src){
    audio.play().catch(function(){});
    P.state='playing'; setNow(); render(); return;
  }
  var a=allStations();
  var back=S.cur? byUrl(S.cur.u) : null;
  playStation(back || a[0]);
}

function step(d){
  var a=allStations();
  if(!a.length) return;
  var i=-1;
  for(var k=0;k<a.length;k++){ if(a[k].u===P.url){ i=k; break; } }
  if(i<0) i=0; else i=(i+d+a.length)%a.length;
  playStation(a[i]);
}
function nextStation(){ step(1); }
function prevStation(){ step(-1); }

/* 历史 */
function pushHist(st){
  S.hist=S.hist.filter(function(x){ return x.u!==st.u; });
  S.hist.unshift({u:st.u, n:st.n, c:st.c||'', t:Date.now()});
  if(S.hist.length>12) S.hist.length=12;
  save();
}

/* 定时关机
   到点前 20 秒开始把音量慢慢收到 0（睡着的人不会被「啪」一下惊醒），
   然后暂停并把音量还原，下次听还是原来的音量。 */
var sleepTimer=null, sleepEnd=0, fadeTimer=null;
function fadeOut(cb){
  if(fadeTimer){ clearInterval(fadeTimer); fadeTimer=null; }
  var from=audio.volume, steps=20, i=0;
  fadeTimer=setInterval(function(){
    i++;
    var v=from*(1-i/steps);
    try{ audio.volume=Math.max(0, v); }catch(e){}
    if(i>=steps){
      clearInterval(fadeTimer); fadeTimer=null;
      try{ audio.volume=from; }catch(e){}
      if(cb) cb();
    }
  }, 1000);
}
function setSleep(min){
  S.sleepMin=min; save();
  if(sleepTimer){ clearInterval(sleepTimer); sleepTimer=null; }
  if(fadeTimer){ clearInterval(fadeTimer); fadeTimer=null; try{ audio.volume=S.vol; }catch(e){} }
  if(!min){ $('sleepBadge').style.display='none'; return; }
  if(min<0){
    /* 播完就停：只对本地库里的音轨有意义（直播流没有「完了」这一说） */
    $('sleepBadge').style.display='';
    $('sleepBadge').textContent='播完就停';
    return;
  }
  sleepEnd=Date.now()+min*60000;
  $('sleepBadge').style.display='';
  sleepTimer=setInterval(function(){
    var left=sleepEnd-Date.now();
    if(left<=0){
      clearInterval(sleepTimer); sleepTimer=null;
      recAutoStop();                       // 录音先收好，别让睡着听的那段丢了
      stopAudio();
      P.state='idle'; P.url=null; setNow(); render();
      $('sleepBadge').style.display='none'; S.sleepMin=0; save();
      // 关了机就不该再自己接回去
      toast('时辰到了，自己关机了');
      return;
    }
    // 最后 20 秒开始淡出
    if(left<=20000 && !fadeTimer && P.state==='playing'){
      fadeOut(function(){
        try{ audio.pause(); }catch(e){}
      });
    }
    var m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
    $('sleepBadge').textContent='定时 '+m+':'+(sec<10?'0':'')+sec;
  }, 1000);
}

/* 音量 */
function setVol(v){
  S.vol=Math.max(0, Math.min(1, v));
  audio.volume=S.vol; save();
  $('volMeter').style.width=(S.vol*100)+'%';
  var rot=-118+S.vol*236;                 // 两个旋钮同步指示音量
  $('knobPrev').style.setProperty('--rot', rot+'deg');
  $('knobNext').style.setProperty('--rot', rot+'deg');
}

/* ══════════════════════════════════════════════════════
   四·五、录音：把正在听的这一段存下来
   ──────────────────────────────────────────────────────
   两条路，自动挑：

   ①「原流直录」——直接去 fetch 电台的流，收原始字节。
      音质就是电台原样，产物是 .mp3 / .aac，哪儿都能放，也最省电。
      前提是这条流允许跨域（服务端给得出 Access-Control-Allow-Origin）。

   ②「采音重编」——从播放器上把声音采下来，转成 opus（.webm，64 kbps）。
      给 HLS（m3u8）那种拉分片的台用，也当①走不通时的兜底。
      实测：采到的声音与扬声器音量无关，所以定时关机的音量渐弱
      不会把录音也一起淡掉。

   两条都不通就明说这个台录不了，不假装录上。
   ══════════════════════════════════════════════════════ */
var REC={on:false, t0:0, timer:null, engine:'', mr:null, chunks:[], aborter:null,
         bytes:0, name:'', plan:0, started:false, wantSave:false, done:false, endMs:0,
         parts:null, rawTotal:0};

function recElapsed(){ return REC.on ? (Date.now()-REC.t0) : (REC.endMs||0); }
function recClock(ms){
  var s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if(h) return h+':'+(m%60<10?'0':'')+(m%60)+':'+(s%60<10?'0':'')+(s%60);
  return m+':'+(s%60<10?'0':'')+(s%60);
}
function recPaint(){
  var b=$('recBadge');
  if(b){
    if(REC.on){
      b.style.display='';
      b.textContent='● '+recClock(recElapsed())+(REC.bytes?(' · '+fmtSize(REC.bytes)):'');
    }else{
      b.style.display='none';
    }
  }
  syncRecBtn();
}
function recTickStart(){
  if(REC.timer) clearInterval(REC.timer);
  REC.timer=setInterval(function(){
    if(!REC.on){ clearInterval(REC.timer); REC.timer=null; return; }
    recPaint();
    if(REC.plan && recElapsed()>=REC.plan) recStop(true, '到点了');
  }, 1000);
}

/* 这一次要录多久（毫秒）。0 = 不定时，一直录到手动停 */
function recPlanMs(){
  var m=S.recMin;
  if(m===-1){
    /* 跟着定时关机停：按关机剩余时间走 */
    if(sleepEnd && sleepEnd>Date.now()) return sleepEnd-Date.now();
    return 0;
  }
  if(m>0) return m*60000;
  return 0;
}

function recStart(){
  if(REC.on) return;
  if(!P.url || P.url.indexOf('local:')===0){
    toast('先选一个台，在放的时候才能录'); return;
  }
  REC.name=P.name||'广播'; REC.on=true; REC.t0=Date.now(); REC.bytes=0;
  REC.chunks=[]; REC.mr=null; REC.aborter=null; REC.started=false;
  REC.wantSave=false; REC.done=false; REC.endMs=0; REC.reloading=false;
  REC.plan=recPlanMs();
  recTickStart(); recPaint();
  if(isHls(P.url)) recCapture();
  else recRaw(P.url);
}

/* ① 原流直录
   注意：停止时**不能**只靠 abort 让 read() 抛错来收尾 —— 实测（Edge 151）
   abort 之后已挂起的 read() 不会 reject，回调永远不触发，录音就丢在半空。
   所以停止时在 recStop 里直接拿已收到的字节落盘，abort 只用来断开下载。 */
function recRaw(url){
  var ctl=null;
  try{ ctl=new AbortController(); }catch(e){ ctl=null; }
  REC.aborter=ctl;
  REC.engine='raw';
  REC.parts=[]; REC.rawTotal=0; REC.ct='';
  var closed=false;
  var opts={mode:'cors'};
  if(ctl) opts.signal=ctl.signal;
  fetch(url, opts).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var ct=(r.headers.get('content-type')||'').toLowerCase();
    REC.ct=ct;
    var rd=r.body.getReader();
    (function pump(){
      return rd.read().then(function(v){
        if(closed || REC.done) return;
        if(v.done){ closed=true; recRawDone(REC.parts, REC.rawTotal, ct); return; }
        REC.parts.push(v.value); REC.rawTotal+=v.value.length; REC.bytes=REC.rawTotal;
        if(REC.plan && recElapsed()>=REC.plan){ closed=true; recRawDone(REC.parts, REC.rawTotal, ct); return; }
        return pump();
      });
    })();
  }).catch(function(e){
    if(closed || REC.done) return;
    closed=true;
    /* 已经收到东西了（多半是流断了）→ 存下来
       一点都没收到 → 这条流不让直录，换采音 */
    if(REC.wantSave || REC.rawTotal>20000) recRawDone(REC.parts, REC.rawTotal, REC.ct||'');
    else if(REC.on){ REC.engine='cap'; recCap(false); }
    else toast('这个台录不了——它不答应从别的页面取流', 3600);
  });
}
function recRawDone(parts, total, ct){
  if(REC.done) return;                    // 只落一次盘
  REC.done=true;
  recWrapUp();
  if(total<8000){
    toast('这次没录到东西——这个台可能不让录', 3600);
    return;
  }
  ct=ct||'';
  var mime='audio/mpeg', ext='.mp3';
  if(ct.indexOf('aac')>=0){ mime='audio/aac'; ext='.aac'; }
  else if(ct.indexOf('ogg')>=0){ mime='audio/ogg'; ext='.ogg'; }
  else if(ct.indexOf('mp4')>=0 || ct.indexOf('m4a')>=0){ mime='audio/mp4'; ext='.m4a'; }
  recFinish(new Blob(parts, {type:mime}), ext, mime);
}
/* 把「正在录」的状态收干净（时间、定时器、按钮、徽标） */
function recWrapUp(){
  if(REC.timer){ clearInterval(REC.timer); REC.timer=null; }
  if(REC.on){ REC.endMs=recElapsed(); }
  REC.on=false;
  var bd=$('recBadge'); if(bd) bd.style.display='none';
  var btn=$('btnRec');
  if(btn){ btn.classList.remove('rec'); btn.textContent='⏺'; }
}

/* ② 采音重编 */
function recCapture(){ recCap(false); }
function recCap(reloaded){
  REC.engine='cap';
  var ms=null, why='';
  try{
    if(typeof audio.captureStream!=='function') why='这个浏览器不给采音';
    else ms=audio.captureStream();
  }catch(e){ why='它的声音来自别的站点，浏览器不让采'; }
  if(!ms && !why) why='它的声音来自别的站点，浏览器不让采';
  if(!ms || !ms.getAudioTracks().length){
    /* Edge 走的是原生 HLS，元素被判成「跨域数据」采不了。
       换成 hls.js 接线（MSE 的 blob: 是同源的），就能采了。 */
    if(!reloaded && isHls(P.url) && typeof Hls!=='undefined' && Hls.isSupported()){
      recReloadViaHls();
      return;
    }
    recFail('这个台录不了——'+(why||'采不到声音'));
    return;
  }
  var mt='audio/webm;codecs=opus';
  try{ if(!MediaRecorder.isTypeSupported(mt)) mt=''; }catch(e){ mt=''; }
  try{
    REC.mr = mt ? new MediaRecorder(ms,{mimeType:mt, audioBitsPerSecond:64000})
                : new MediaRecorder(ms);
  }catch(e){
    recFail('这个浏览器不支持录音');
    return;
  }
  REC.chunks=[];
  REC.mr.ondataavailable=function(e){
    if(e.data && e.data.size){ REC.chunks.push(e.data); REC.bytes+=e.data.size; }
  };
  REC.mr.onstop=function(){
    /* 不是用户按停（比如流断了）也要收好 */
    if(REC.on){ REC.wantSave=true; REC.endMs=recElapsed(); recWrapUp(); }
    var blob=new Blob(REC.chunks, {type:'audio/webm'});
    recFinish(blob, '.webm', 'audio/webm');
  };
  REC.mr.onerror=function(){ recFail('录音中途出错了'); };
  try{ REC.mr.start(1000); }catch(e){ recFail('录音起不来'); return; }
  REC.started=true;
  recPaint();
}
/* 为了能录，把 HLS 换成 hls.js 接线（会有一两秒的接缝） */
function recReloadViaHls(){
  var u=P.url;
  REC.reloading=true;
  if($('nowS')) $('nowS').textContent='为了能录，正在换一种接线方式……';
  stopAudio();
  var ok=hlsStart(u, function(){
    REC.reloading=false;
    recFail('这个台录不了——它不答应从别的页面取流');
  });
  if(!ok){ REC.reloading=false; recFail('这个台录不了'); return; }
  audio.volume=S.vol;
  audio.play().catch(function(){});
  var t0=Date.now();
  (function wait(){
    if(!REC.on){ REC.reloading=false; return; }
    if(audio.readyState>=2){ REC.reloading=false; P.state='playing'; setNow(); recCap(true); return; }
    if(Date.now()-t0>6000){ REC.reloading=false; recFail('这个台录不了——没能重新接上'); return; }
    setTimeout(wait, 400);
  })();
}

/* 停止（save=true 表示存下来） */
function recStop(save, why){
  if(!REC.on) return;
  REC.wantSave=!!save;
  REC.endMs=recElapsed();
  var eng=REC.engine;
  recWrapUp();
  if(REC.mr && REC.mr.state!=='inactive'){
    try{ REC.mr.stop(); }catch(e){}
  }
  /* 直录：直接拿已经收到的字节落盘（abort 不会触发回调，见 recRaw 注释） */
  if(eng==='raw'){
    recRawDone(REC.parts||[], REC.rawTotal||0, REC.ct||'');
  }
  if(REC.aborter){ try{ REC.aborter.abort(); }catch(e){} }
  REC.aborter=null;
}
function recFail(msg){
  var was=REC.on;
  REC.wantSave=false; REC.done=true;
  recWrapUp();
  if(REC.aborter){ try{ REC.aborter.abort(); }catch(e){} }
  if(REC.mr && REC.mr.state!=='inactive'){ try{ REC.mr.stop(); }catch(e){} }
  REC.mr=null; REC.chunks=[]; REC.bytes=0; REC.started=false;
  if(was) toast(msg, 3600);
}

/* 落盘：存进「拾藏 · 录音」 */
function recFinish(blob, ext, mime){
  var conn=(REC.engine==='cap');
  REC.mr=null;
  if(!REC.wantSave || !blob || blob.size<8000){
    REC.chunks=[]; REC.bytes=0; REC.started=false;
    if(conn && REC.wantSave) toast('这次没录到东西——这个台的声音可能采不下来', 3600);
    return;
  }
  var ms=REC.endMs||recElapsed();
  var mi=Math.max(1, Math.round(ms/60000));
  var d=new Date(), p2=function(n){ return (n<10?'0':'')+n; };
  var nm=REC.name+' · '+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+
         p2(d.getHours())+':'+p2(d.getMinutes())+'（录 '+mi+' 分）'+ext;
  var f=blob;
  try{ f=new File([blob], nm, {type:mime||'audio/webm'}); }
  catch(e){ try{ blob.name=nm; }catch(e2){} }
  REC.chunks=[]; REC.bytes=0; REC.started=false; REC.wantSave=false;
  REC.parts=null; REC.rawTotal=0;
  localAdd(f, '录音').then(function(){
    if(VIEW==='local') refreshLocal();
    toast('录好了：'+nm+'（'+fmtSize(blob.size)+'），已收进「拾藏 · 录音」', 4200);
  }).catch(function(){
    toast('录音存不进去了，可能是这台设备空间不够', 3600);
  });
}

/* 定时关机到点：先把录音收好，再关机 */
function recAutoStop(){
  if(REC.on) recStop(true, '跟着关机停');
}

/* 换台 / 关机时顺手把录音收尾 */
function recStopIfPlaying(){
  if(REC.on) recStop(true, '换台了');
}

/* ══════════════════════════════════════════════════════
   五、拾藏（本地点播库 · IndexedDB）
   ══════════════════════════════════════════════════════ */
var DB=null;
function openDB(){
  return new Promise(function(res,rej){
    if(DB) return res(DB);
    var rq=indexedDB.open('xixiazi.media', 1);
    rq.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'id'});
      if(!db.objectStoreNames.contains('blob')) db.createObjectStore('blob', {keyPath:'id'});
    };
    rq.onsuccess=function(){ DB=rq.result; res(DB); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function idb(store, mode, fn){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store, mode), os=tx.objectStore(store);
      var r=fn(os);
      tx.oncomplete=function(){ res(r && r.result!==undefined ? r.result : r); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localList(){
  return idb('meta','readonly',function(os){ return os.getAll(); })
    .then(function(a){ return (a||[]).sort(function(x,y){ return (x.added||0)-(y.added||0); }); });
}
function localAdd(file, group){
  var id='m'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(['meta','blob'],'readwrite');
      tx.objectStore('blob').put({id:id, data:file});
      tx.objectStore('meta').put({id:id, n:file.name, sz:file.size, g:group||'',
                                  added:Date.now(), pos:0, dur:0});
      tx.oncomplete=function(){ res(id); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localMeta(id, patch){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('meta','readwrite'), os=tx.objectStore('meta');
      var g=os.get(id);
      g.onsuccess=function(){
        var m=g.result; if(!m) return res(null);
        for(var k in patch){ m[k]=patch[k]; }
        os.put(m); res(m);
      };
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localDel(id){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(['meta','blob'],'readwrite');
      tx.objectStore('meta').delete(id);
      tx.objectStore('blob').delete(id);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localBlob(id){
  return idb('blob','readonly',function(os){ return os.get(id); })
    .then(function(r){ return r && r.data ? r.data : null; });
}

/* 本地播放 */
var LP={ id:null, url:null, dur:0, seeking:false, tick:null };
/* 顺序放下一段（本地库播完自动接上） */
function localNext(){
  if(!LOCALS || !LOCALS.length) return;
  var cur=LP.id, i=-1;
  for(var k=0;k<LOCALS.length;k++){ if(LOCALS[k].id===cur){ i=k; break; } }
  var nx=LOCALS[(i+1)%LOCALS.length];
  if(nx) localPlay(nx);
}

function localPlay(rec){
  if(!rec) return;
  if(REC.on) recStopIfPlaying();          // 转去听本地戏了，先把录音收好
  localBlob(rec.id).then(function(blob){
    if(!blob){ toast('这个文件读不出来了，可能已损坏'); return; }
    if(LP.url) URL.revokeObjectURL(LP.url);
    LP.id=rec.id; LP.dur=rec.dur||0;
    LP.url=URL.createObjectURL(blob);
    if(P.retryTimer){ clearTimeout(P.retryTimer); P.retryTimer=null; }
    stopAudio();
    audio.src=LP.url;
    audio.volume=S.vol;
    P.url='local:'+rec.id; P.name=rec.n; P.cat='拾藏'; P.state='loading';
    S.cur={u:P.url, n:rec.n, c:'拾藏'}; save();
    setNow(); render();
    audio.addEventListener('loadedmetadata', function once(){
      audio.removeEventListener('loadedmetadata', once);
      LP.dur=audio.duration||0;
      localMeta(rec.id, {dur:LP.dur});
      if(rec.pos>1) audio.currentTime=Math.min(rec.pos, LP.dur-1);
    });
    var pr=audio.play();
    if(pr&&pr.catch) pr.catch(function(){});
  });
}
/* 断点续播：每 4 秒写一次进度 */
audio.addEventListener('timeupdate', function(){
  if(!LP.id || LP.seeking) return;
  var t=audio.currentTime;
  if(!LP.tick || Date.now()-LP.tick>4000){
    LP.tick=Date.now();
    localMeta(LP.id, {pos:t, dur:audio.duration||LP.dur||0});
  }
});
function flushLocalPos(){
  if(LP.id && audio.currentTime>0){ localMeta(LP.id, {pos:audio.currentTime}); }
}
document.addEventListener('visibilitychange', function(){ if(document.hidden) flushLocalPos(); });
window.addEventListener('beforeunload', flushLocalPos);

/* ══════════════════════════════════════════════════════
   六、渲染
   ══════════════════════════════════════════════════════ */
var VIEW='radio';
var NAV=[['radio','戏台'],['local','拾藏'],['help','帮助'],['faq','疑难'],['legal','免责'],['about','关于']];

function renderNav(){
  var h='';
  for(var i=0;i<NAV.length;i++){
    h+='<button data-v="'+NAV[i][0]+'" class="'+(VIEW===NAV[i][0]?'on':'')+'">'+esc(NAV[i][1])+'</button>';
  }
  $('nav').innerHTML=h;
}

function render(){
  renderNav();
  if(P.url) setNeedle();
  var m=$('main');
  if(VIEW==='radio') m.innerHTML=viewRadio();
  else if(VIEW==='local') m.innerHTML=viewLocal();
  else if(VIEW==='help') m.innerHTML=viewHelp();
  else if(VIEW==='faq') m.innerHTML=viewFaq();
  else if(VIEW==='legal') m.innerHTML=viewLegal();
  else m.innerHTML=viewAbout();
  if(VIEW==='local') refreshLocal();
  if(VIEW==='radio'){
    var qi=document.getElementById('qInput');
    if(qi && QFOCUS && document.activeElement!==qi){
      qi.focus();
      try{ qi.setSelectionRange(qi.value.length, qi.value.length); }catch(e){}
    }
  }
}

function stCardHTML(s, i){
  var cur=(P.url===s.u);
  var lamp=cur? (P.state==='error'?'<span class="dot f"></span>':'<span class="dot"></span>') : '';
  var fv=isFav(s.u);
  var t=(fv?'取消收藏':'收进收藏');
  /* 卡片本身是 div 而不是 button：才能在里面放星标按钮（button 不能嵌套 button） */
  return '<div class="st'+(cur?' cur':'')+'" data-i="'+i+'" role="button" tabindex="0">'+
    '<div class="r1"><div class="n">'+esc(s.n)+'</div>'+
    '<button class="favb'+(fv?' on':'')+'" data-fav="'+esc(s.u)+'" title="'+t+'" '+
    'aria-label="'+t+'">'+(fv?'★':'☆')+'</button></div>'+
    '<div class="m">'+lamp+'<span class="tagc">'+esc(s.c||'')+'</span>'+
    (s.custom?'<span class="tagc">自建</span>':'')+
    '</div></div>';
}

function viewRadio(){
  var a=allStations();
  var cats=['全部','收藏'].concat(CATS);
  // 自建台单独成类
  var hasCustom=S.custom.length>0;
  if(hasCustom) cats.push('自建');
  var cur=S.lastCat||'全部';
  if(cats.indexOf(cur)<0) cur='全部';

  var h='';
  h+='<div class="card">';
  h+='<h2>戏台</h2>';
  h+='<div class="qbox"><span class="qi">⌕</span>'+
     '<input type="search" id="qInput" autocomplete="off" spellcheck="false" '+
     'placeholder="搜台名 / 省份 / 拼音：河南、henan、nbxw" value="'+esc(Q)+'">'+
     '<button class="qclear'+(Q?'':' hide')+'" data-qclear="1" aria-label="清空搜索">✕</button></div>';
  h+='<p class="hint">'+a.length+' 个台已经过试播验证。点一下就能开声听。</p>';
  h+='<div class="chips grid" id="catChips">';
  for(var i=0;i<cats.length;i++){
    var c=cats[i], n=(c==='全部')?a.length:a.filter(function(x){ return inCat(x,c); }).length;
    /* 空分类不摆出来，免得点进去是空的。
       「全部」与「收藏」例外：「收藏」是入口，空着也要在，好让人知道有这功能。 */
    if(n===0 && c!=='全部' && c!=='收藏') continue;
    h+='<button class="chip'+(cur===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="cn">'+n+'</span></button>';
  }
  h+='</div>';
  if(cur==='地方台'){
    var pv=S.lastProv||'全国';
    if(PROVS.indexOf(pv)<0) pv='全国';
    h+='<div class="chips grid" id="provChips">';
    h+='<button class="chip'+(pv==='全国'?' on':'')+'" data-prov="全国">全国<span class="cn">'+
       a.filter(function(x){ return inCat(x,'地方台'); }).length+'</span></button>';
    for(var pi=0;pi<PROVS.length;pi++){
      var pn=PROVS[pi], pc=a.filter(function(x){ return (x.g||[]).indexOf(pn)>=0; }).length;
      if(!pc) continue;                        // 没台就不占位
      h+='<button class="chip'+(pv===pn?' on':'')+'" data-prov="'+pn+'">'+pn+'<span class="cn">'+pc+'</span></button>';
    }
    h+='</div>';
  }
  if(CATDESC[cur]) h+='<p class="hint">'+esc(CATDESC[cur])+'</p>';
  h+='</div>';

  var list=a;
  if(cur!=='全部'){
    var pvSel=(cur==='地方台')? (S.lastProv||'全国') : '全国';
    list=a.filter(function(x){ return inCat(x,cur) && inProv(x,pvSel); });
  }
  if(cur==='收藏'){
    /* 收藏按「最近收的排前面」走，不看台单顺序 */
    list=[];
    for(var fi=S.fav.length-1;fi>=0;fi--){
      var fst=byUrl(S.fav[fi]);
      if(fst) list.push(fst);
    }
  }
  var kw=(Q||'').trim().toLowerCase();
  if(kw){
    var kwpy=kw.replace(/[^a-z0-9]/g,'');       // 关键词的纯字母形态
    list=list.filter(function(x){
      var blob=(x.n+' '+(x.c||'')+' '+((x.g||[]).join(' '))).toLowerCase();
      if(blob.indexOf(kw)>=0) return true;
      if(!kwpy) return false;
      /* 拼音通道：关键词是字母时，同时比「全拼」与「首字母串」——
         全拼收 henan / xianggang 这种整词，首字母收 nbxw 这种缩写 */
      var full=fullPy(x.n), ini=pyOf(x.n);
      if(full.indexOf(kwpy)>=0 || ini.indexOf(kwpy)>=0) return true;
      var gtxt=(x.g||[]).join('');
      if(fullPy(gtxt).indexOf(kwpy)>=0 || pyOf(gtxt).indexOf(kwpy)>=0) return true;
      return false;
    });
    h+='<div class="card" style="padding:11px 15px"><p class="hint" style="margin:0">'+
       '“'+esc(Q)+'” 找到 <b>'+list.length+'</b> 个台</p></div>';
  }
  if(!list.length){
    h+='<div class="card"><p>'+(kw? '没有这样的台，换个词试试。'
       : (cur==='收藏'
          ? '还没收着一个台。点台卡片右上角的 <b>☆</b>，或者按下面播放条上的 <b>☆</b>，就收进来了。'
          : '这一类还没有台。'))+'</p></div>';
  }else{
    if(cur==='收藏'){
      h+='<p class="hint" style="margin:0 0 9px">收了 '+list.length+
         ' 个台，最近收的排在前头。点实心的 <b>★</b> 就移出去。</p>';
    }
    /* 收藏多了（≥13 个）就按省份/分类分组，免得一长条翻半天；
       少的时候不平铺分组，省得一个组里孤零零一个台。 */
    if(cur==='收藏' && list.length>=13 && !kw){
      var ORDER=['央广','国广'].concat(PROVS).concat(['交通台','新闻综合','教育台','戏曲',
        '说书','文艺','音乐','怀旧老歌','网络台','电视伴音','自建']);
      var used={}, groups=[];
      for(var oi=0;oi<ORDER.length;oi++){
        var key=ORDER[oi];
        var sub=list.filter(function(x){
          var gg=x.g||[x.c];
          if(key==='自建') return !!x.custom;
          if(key==='央广'||key==='国广') return gg.indexOf(key)>=0;
          if(PROVS.indexOf(key)>=0) return gg.indexOf(key)>=0;
          return gg.indexOf(key)>=0;
        });
        if(sub.length){ used[key]=1; groups.push([key, sub]); }
      }
      /* 没归进任何组的（比如只带了自定义标签）兜在最后 */
      var rest=list.filter(function(x){
        var gg=x.g||[x.c];
        for(var k=0;k<groups.length;k++){ if(groups[k][1].indexOf(x)>=0) return false; }
        return true;
      });
      if(rest.length) groups.push(['其余', rest]);
      for(var gi=0;gi<groups.length;gi++){
        h+='<div class="grp"><div class="ghd"><h3>'+esc(groups[gi][0])+
           '<span class="cn">'+groups[gi][1].length+'</span></h3></div>';
        h+='<div class="stgrid">';
        for(var gj=0;gj<groups[gi][1].length;gj++){
          h+=stCardHTML(groups[gi][1][gj], a.indexOf(groups[gi][1][gj]));
        }
        h+='</div></div>';
      }
    }else{
      h+='<div class="stgrid">';
      for(var j=0;j<list.length;j++){ h+=stCardHTML(list[j], a.indexOf(list[j])); }
      h+='</div>';
    }
  }

  // 常听的台已收进上方「收藏」分类，不再重复成卡
  // 最近听过
  if(S.hist.length){
    h+='<div class="card"><div class="hd"><h3>最近听过</h3>'+
       '<button class="chip" data-histclear="1">一键清零</button></div>'+
       '<div class="chips grid" id="histChips">';
    for(var q=0;q<S.hist.length;q++){
      h+='<button class="chip" data-hist="'+esc(S.hist[q].u)+'">'+esc(S.hist[q].n)+'</button>';
    }
    h+='</div><p class="hint" style="margin:9px 0 0">点台名直接接着听。清零只清这份记录，收藏不动。</p></div>';
  }

  h+='<div class="card"><h3>自己加一个台</h3>'+
     '<p class="hint">手上有别的戏曲 / 评书直播地址（<code>.mp3</code> 或 <code>.m3u8</code> 结尾），可以收进来。</p>'+
     '<div class="chips grid" id="catPick">'+
       CATS.map(function(c){ return '<button class="chip" data-newcat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+
     '</div>'+
     '<p class="hint">选好归到哪一类，再填名字和地址：</p>'+
     '<label class="f">台名</label><input type="text" id="inName" placeholder="例如：老家县城的戏台">'+
     '<label class="f">播放地址</label><input type="url" id="inUrl" placeholder="https://…….mp3">'+
     '<div class="row" style="margin-top:12px"><button class="btn" id="btnAddSt">收进来</button>'+
     '<span class="hint" id="addHint">还没选分类</span></div></div>';

  h+='<div class="card"><h3>最近半小时没人管它</h3>'+
     '<p class="hint">定时关机在右上角 ⚙ 里设；听戏睡着了也不怕。</p></div>';
  return h;
}

var LOCALS=[];
function refreshLocal(){
  var el=$('localList'); if(!el) return;
  localList().then(function(a){
    LOCALS=a||[];
    var c=$('localCount'); if(c) c.textContent=LOCALS.length;
    var box=$('localList'); if(!box) return;
    if(!LOCALS.length){ box.innerHTML='<p class="hint">还没放东西进来。</p>'; return; }
    var h='';
    for(var i=0;i<LOCALS.length;i++){
      var m=LOCALS[i], cur=(P.url==='local:'+m.id);
      h+='<div class="lrow"'+(cur?' style="border-color:var(--dan)"':'')+'>'+
         '<div class="g"><div class="t">'+esc(m.n)+'</div>'+
         '<div class="s">'+esc(fmtSize(m.sz))+
           (m.pos>3?(' · 上次听到 '+esc(fmtTime(m.pos))):'')+
           (m.g?(' · '+esc(m.g)):'')+'</div></div>'+
         '<button class="btn ghost" data-lp="'+esc(m.id)+'">'+(cur&&P.state==='playing'?'暂停':'收听')+'</button>'+
         '<button class="btn ghost" data-ls="'+esc(m.id)+'" title="存成普通文件，落到下载目录">存文件</button>'+
         '<button class="btn ghost" data-ld="'+esc(m.id)+'" title="倒掉">倒掉</button>'+
         '</div>';
    }
    box.innerHTML=h;
  }).catch(function(){});
}

function importFiles(files){
  if(!files || !files.length) return;
  var arr=[], total=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>0 && (/\.(mp3|m4a|aac|ogg|opus|wav|flac|wma|mp4|m3u8|ts)$/i.test(f.name) || (f.type||'').indexOf('audio')===0)){
      arr.push(f); total+=f.size;
    }
  }
  if(!arr.length){ toast('没找到能听的音频文件'); return; }
  var bar=$('impBar'), fill=$('impFill'), txt=$('impTxt');
  if(bar){ bar.style.display=''; fill.style.width='0%'; }
  if(txt) txt.textContent='准备收进来：'+arr.length+' 个文件，共 '+fmtSize(total);
  var done=0;
  (function next(){
    if(done>=arr.length){
      if(fill) fill.style.width='100%';
      if(txt) txt.textContent='放好了：'+arr.length+' 个文件。往下看，已经收进来了。';
      toast('放进去了 '+arr.length+' 个');
      setTimeout(function(){ if(bar) bar.style.display='none'; }, 1600);
      refreshLocal();
      return;
    }
    var f=arr[done];
    var g=(f.webkitRelativePath||'').split('/')[0] || '';
    localAdd(f, g).then(function(){
      done++;
      if(fill) fill.style.width=((done/arr.length)*100).toFixed(0)+'%';
      if(txt) txt.textContent='放进去了 '+done+' / '+arr.length+'：'+f.name;
      next();
    }).catch(function(){
      done++;
      if(txt) txt.textContent='有一个没放进去：'+f.name;
      next();
    });
  })();
}

function applyTheme(){

  }

function exportJSON(){
  var data={app:'xixiazi', v:1, t:Date.now(), s:S};
  var blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date();
  a.href=url;
  a.download='xixiazi-backup-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

}
function importJSON(text){
  var o;
  try{ o=JSON.parse(text); }catch(e){ toast('这个文件读不出来，不是备份文件？'); return; }
  var s=(o && o.app==='xixiazi' && o.s) ? o.s : (o && o.vol!=null ? o : null);
  if(!s){ toast('这不是拾声的备份文件'); return; }
  for(var k in s){ if(s.hasOwnProperty(k)) S[k]=s[k]; }
  save(); applyAll(); setVol(S.vol);
  if(S.sleepMin) setSleep(S.sleepMin);
  render();
  toast('备份恢复好了');
}

var NEWCAT=null;
var LONGPRESSED=false;

/* 向上找带某属性的祖先（点卡片里的文字也能命中卡片本身） */
function closestAttr(el, attr){
  while(el && el!==document.body){
    if(el.getAttribute && el.getAttribute(attr)!=null) return el;
    el=el.parentNode;
  }
  return null;
}

document.addEventListener('input', function(e){
  var t=e.target;
  if(t && t.id==='qInput'){ Q=t.value; QFOCUS=true; render(); }
});
document.addEventListener('focusin', function(e){
  if(e.target && e.target.id==='qInput') QFOCUS=true;
});
document.addEventListener('focusout', function(e){
  if(e.target && e.target.id==='qInput'){
    setTimeout(function(){
      var q=document.getElementById('qInput');
      if(document.activeElement!==q) QFOCUS=false;
    }, 160);
  }
});

document.addEventListener('click', function(e){
  var el;

  // 导航
  el=closestAttr(e.target,'data-v');
  if(el){ VIEW=el.getAttribute('data-v'); window.scrollTo(0,0); render(); return; }

  // 卡片上的星标（要排在「选台」前面，否则会被当成点卡片）
  el=closestAttr(e.target,'data-fav');
  if(el){ toggleFav(el.getAttribute('data-fav')); return; }

  // 听过的一键清零
  el=closestAttr(e.target,'data-histclear');
  if(el){
    if(!window.confirm('听过的记录会全部清掉，收藏和自建台不受影响。确定？')) return;
    S.hist=[]; save(); render(); toast('听过的记录已清零');
    return;
  }

  // 选台
  el=closestAttr(e.target,'data-i');
  if(el && el.classList && el.classList.contains('st')){
    if(LONGPRESSED){ LONGPRESSED=false; return; }
    var a=allStations(), st=a[parseInt(el.getAttribute('data-i'),10)];
    if(!st) return;
    if(P.url===st.u && P.state==='playing'){ audio.pause(); P.state='paused'; setNow(); render(); return; }
    if(P.url===st.u && P.state==='paused'){ audio.play().catch(function(){}); P.state='playing'; setNow(); render(); return; }
    playStation(st);
    return;
  }

  // 分类筛选
  el=closestAttr(e.target,'data-qclear');
  if(el){ Q=''; QFOCUS=true; render(); return; }
  el=closestAttr(e.target,'data-cat');
  if(el){ S.lastCat=el.getAttribute('data-cat'); save(); render(); return; }
  el=closestAttr(e.target,'data-prov');
  if(el){ S.lastProv=el.getAttribute('data-prov'); save(); render(); return; }

  // 最近听过
  el=closestAttr(e.target,'data-hist');
  if(el){
    var su=el.getAttribute('data-hist'), s2=byUrl(su);
    if(s2) playStation(s2); else toast('这个台已经不在清单里了');
    return;
  }

  // 自建台归到哪一类
  el=closestAttr(e.target,'data-newcat');
  if(el){
    NEWCAT=el.getAttribute('data-newcat');
    var bh=$('addHint'); if(bh) bh.textContent='归到「'+NEWCAT+'」';
    var box0=el.parentNode, chips=box0.querySelectorAll('.chip');
    for(var z=0;z<chips.length;z++){ chips[z].classList.toggle('on', chips[z]===el); }
    return;
  }

  // 常见问题折叠
  el=closestAttr(e.target,'data-qa');
  if(el){
    var box=el.closest ? el.closest('.qa') : el.parentNode;
    if(box && box.classList.contains('qa')) box.classList.toggle('on');
    return;
  }

  // 拾藏 · 播放 / 倒掉
  el=closestAttr(e.target,'data-lp');
  if(el){
    var lp=el.getAttribute('data-lp');
    if(P.url==='local:'+lp && P.state==='playing'){
      flushLocalPos(); audio.pause(); P.state='paused'; setNow(); render(); return;
    }
    if(P.url==='local:'+lp && P.state==='paused'){
      audio.play().catch(function(){}); P.state='playing'; setNow(); render(); return;
    }
    var rec=null;
    for(var m=0;m<LOCALS.length;m++){ if(LOCALS[m].id===lp){ rec=LOCALS[m]; break; } }
    if(rec) localPlay(rec); else toast('读不到这一条');
    return;
  }
  el=closestAttr(e.target,'data-ls');
  if(el){
    var sf=el.getAttribute('data-ls'), srec=null;
    for(var q=0;q<LOCALS.length;q++){ if(LOCALS[q].id===sf){ srec=LOCALS[q]; break; } }
    if(!srec){ toast('读不到这一条'); return; }
    el.disabled=true;
    localBlob(sf).then(function(b){
      el.disabled=false;
      if(!b){ toast('这个文件读不出来了'); return; }
      var u=URL.createObjectURL(b);
      var a2=document.createElement('a');
      a2.href=u; a2.download=safeFn(srec.n);
      document.body.appendChild(a2); a2.click();
      setTimeout(function(){
        if(a2.parentNode) a2.parentNode.removeChild(a2);
        URL.revokeObjectURL(u);
      }, 2000);
      toast('已存成文件，去下载目录拿');
    }).catch(function(){ el.disabled=false; toast('存不出来，可能这台设备空间不够'); });
    return;
  }
  el=closestAttr(e.target,'data-ld');
  if(el){
    var ld=el.getAttribute('data-ld');
    if(!window.confirm('这一条会倒掉，本机上的原文件不受影响。确定？')) return;
    localDel(ld).then(function(){
      if(P.url==='local:'+ld){ stopAudio(); P.url=null; P.state='idle'; setNow(); }
      refreshLocal(); toast('倒掉了');
    });
    return;
  }
});

/* 卡片是 div，补键盘操作：回车 / 空格开声 */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
  if(closestAttr(e.target,'data-fav')) return;    // 焦点在星标上，交给星标自己处理
  var el=closestAttr(e.target,'data-i');
  if(el && el.classList && el.classList.contains('st')){
    e.preventDefault();
    el.click();
  }
});

/* 长按 / 双击收藏 */
var pressTimer=null;
document.addEventListener('pointerdown', function(e){
  if(closestAttr(e.target,'data-fav')) return;   // 星标上的长按不算收藏手势
  var el=closestAttr(e.target,'data-i');
  if(el && el.classList && el.classList.contains('st')){

  }
});
['pointerup','pointercancel','pointermove','scroll'].forEach(function(ev){
  document.addEventListener(ev, function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }, true);
});

function toggleFav(u){
  var i=S.fav.indexOf(u);
  if(i>=0){
    S.fav.splice(i,1);
    toast('已从收藏里移出');
  }else{
    S.fav.push(u);
    toast(S.fav.length===1? '收进收藏了，在「收藏」那一类里' : '收进收藏了');
  }
  save(); render(); syncFavBtn();
}

/* 播放条 */
$('btnPlay').addEventListener('click', togglePlay);
$('btnFav').addEventListener('click', function(){
  if(P.url && P.url.indexOf('local:')!==0) toggleFav(P.url);
});
$('btnRec').addEventListener('click', function(){
  if(REC.on) recStop(true);
  else recStart();
});
$('knobPrev').addEventListener('click', prevStation);
$('knobNext').addEventListener('click', nextStation);
$('btnVolUp').addEventListener('click', function(){ setVol(S.vol+0.1); });
$('btnVolDown').addEventListener('click', function(){ setVol(S.vol-0.1); });
$('btnGear').addEventListener('click', function(){ applyAll(); openSheet(true); });
$('mask').addEventListener('click', function(){ openSheet(false); });

/* 设置面板里的分段控件 */
document.addEventListener('click', function(e){
  var t=e.target;
  if(!t.getAttribute) return;
  var th=t.getAttribute('data-th'); if(th){ S.theme=th; save(); applyAll(); return; }
  var ui=t.getAttribute('data-ui'); if(ui){ S.ui=parseFloat(ui); save(); applyAll(); return; }
  var tp=t.getAttribute('data-tap'); if(tp){ S.tap=parseInt(tp,10); save(); applyAll(); return; }
  var mo=t.getAttribute('data-mo'); if(mo){ S.motion=mo; save(); applyAll(); return; }
  var sl=t.getAttribute('data-sl'); if(sl){
    var sv=parseInt(sl,10);
    setSleep(sv); applyAll();
    toast(sv===0?'不定时了':(sv<0?'这一段放完就停':'到点自动关机：'+sv+' 分钟'));
    return; }
  var rc=t.getAttribute('data-rc'); if(rc){
    S.recMin=parseInt(rc,10); save(); applyAll();
    toast(S.recMin===0?'录音改成不定时，按一下停一下':
          (S.recMin<0?'录音会跟着定时关机一起停':
                      '录音一次录 '+S.recMin+' 分钟'));
    return; }
  var rs=t.getAttribute('data-rs'); if(rs){ S.resume=parseInt(rs,10); save(); applyAll(); return; }
  var sk=t.getAttribute('data-sk'); if(sk){ S.skip=parseInt(sk,10); save(); applyAll(); return; }
});

/* 加自建台 */
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnAddSt') return;
  var n=($('inName')||{}).value||'', u=($('inUrl')||{}).value||'';
  n=n.trim(); u=u.trim();
  if(!n){ toast('先给这个台起个名字'); return; }
  if(!/^https?:\/\//i.test(u)){ toast('地址要以 http:// 或 https:// 开头'); return; }
  for(var i=0;i<S.custom.length;i++){ if(S.custom[i].u===u){ toast('这个地址已经收进来了'); return; } }
  S.custom.unshift({n:n, u:u, c:NEWCAT||'自建'});
  save(); toast('加进去了：'+n);
  NEWCAT=null; render();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnExport') return;
  exportJSON();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnImport') return;
  $('fileImportJson').click();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnReset') return;
  if(!window.confirm('会清掉收藏、自建台和所有设置（「拾藏」里的音频要单独倒）。确定？')) return;
  localStorage.removeItem(KEY);
  location.reload();
});
$('fileImportJson').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ importJSON(String(r.result)); };
  r.readAsText(f);
  e.target.value='';
});

/* 拾藏按钮 */
document.addEventListener('click', function(e){
  var id=e.target && e.target.id;
  if(id==='btnPickAudio') $('fileAudio').click();
  else if(id==='btnPickDir') $('fileAudioDir').click();
  else if(id==='btnLocalShuffle'){
    if(!LOCALS.length){ toast('还没拾到东西'); return; }
    localPlay(LOCALS[Math.floor(Math.random()*LOCALS.length)]);
  }
  else if(id==='btnLocalClear'){
    if(!LOCALS.length){ toast('本来就是空的'); return; }
    if(!window.confirm('「拾藏」里的 '+LOCALS.length+' 条会全部倒掉，本机原文件不受影响。确定？')) return;
    var ids=LOCALS.map(function(x){ return x.id; });
    Promise.all(ids.map(localDel)).then(function(){
      if(P.url && P.url.indexOf('local:')===0){ stopAudio(); P.url=null; P.state='idle'; setNow(); }
      refreshLocal(); toast('倒干净了');
    });
  }
});
$('fileAudio').addEventListener('change', function(e){ importFiles(e.target.files); e.target.value=''; });
$('fileAudioDir').addEventListener('change', function(e){ importFiles(e.target.files); e.target.value=''; });

/* 拖拽进拾藏 */
document.addEventListener('dragover', function(e){
  var d=$('drop'); if(!d) return;
  e.preventDefault(); d.classList.add('over');
});
document.addEventListener('dragleave', function(e){
  var d=$('drop'); if(d) d.classList.remove('over');
});
document.addEventListener('drop', function(e){
  var d=$('drop'); if(!d) return;
  e.preventDefault(); d.classList.remove('over');
  if(e.dataTransfer && e.dataTransfer.files) importFiles(e.dataTransfer.files);
});

/* 键盘：空格开关，左右换台 */
document.addEventListener('keydown', function(e){
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowRight'){ nextStation(); }
  else if(e.code==='ArrowLeft'){ prevStation(); }
});

/* 系统主题变化 */
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    if(S.theme==='system') applyTheme();
  });
}catch(e){}

/* ══════════════════════════════════════════════════════
   十、启动
   ══════════════════════════════════════════════════════ */
(function boot(){
  load();
  applyAll();
  setVol(S.vol);
  if(S.sleepMin) setSleep(S.sleepMin);
  if(S.resume && S.cur && S.cur.u){
    var back=byUrl(S.cur.u);
    P.url=S.cur.u; P.name=S.cur.n; P.cat=S.cur.c||'';
    P.vs=variants(S.cur.u); P.vi=0; P.state='paused';
    if(back && back.n){ P.name=back.n; P.cat=back.c||P.cat; }
  }
  VIEW='radio';
  render();
  setNow();
  if(P.url) setNeedle();
})();
</script>
</body>
</html>
