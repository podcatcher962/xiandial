<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1C1F">
<title>拾声 · 声音里的戏园子</title>
<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D; --acc:#4A9EFF; --acc2:#7CBDFF;
  --ok:#3FC08A; --warn:#E8A33D; --dan:#E2685F;
  --wood1:#5C3F2B; --wood2:#3D2A1C; --wood3:#2C1E13;
  --grille:#12100E; --dial:#C9B79A; --glow:rgba(232,163,61,.55);
  --ui:1; --tap:38px; --r:12px;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#EDEFF2; --line:#D7DADF;
  --tx:#1D1F23; --tx2:#5E646C; --acc:#1668C4; --acc2:#0F4E96;
  --ok:#1E8A5F; --warn:#9A6410; --dan:#B33A31;
  --wood1:#C9A67E; --wood2:#A98960; --wood3:#8A6C46;
  --grille:#5B4633; --glow:rgba(154,100,16,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:calc(15px * var(--ui)); line-height:1.65;
  padding-bottom:calc(138px + env(safe-area-inset-bottom));
}
html[data-motion="low"] *{animation:none !important;transition:none !important}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}

/* ---------- 机身外壳 ---------- */
.shell{
  position:relative; overflow:hidden;
  background:
    repeating-linear-gradient(88deg, rgba(0,0,0,.16) 0 1px, rgba(255,255,255,.025) 1px 3px, rgba(0,0,0,.05) 3px 6px),
    linear-gradient(170deg, var(--wood1), var(--wood2) 58%, var(--wood3));
  border-bottom:3px solid rgba(0,0,0,.45);
  box-shadow:0 6px 22px rgba(0,0,0,.45);
  padding:14px 16px 12px;
}
.shell::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%, rgba(0,0,0,.22));
}
.brand{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;position:relative;z-index:2;padding-right:44px}
.brand h1{
  margin:0;font-size:calc(23px * var(--ui));letter-spacing:.16em;font-weight:700;
  color:#F5EEE4;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 14px rgba(255,220,170,.18);
}
.brand .sub{font-size:calc(12px * var(--ui));color:rgba(245,238,228,.62);letter-spacing:.08em}
.brand .gear{
  position:absolute;right:0;top:2px;
  width:var(--tap);height:var(--tap);min-width:var(--tap);
  border-radius:9px;border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.22);color:#F5EEE4;font-size:calc(17px * var(--ui));
}
.brand .gear:active{background:rgba(0,0,0,.4)}

/* 扬声器网 + 调频窗 */
.panel{display:flex;gap:14px;align-items:stretch;margin-top:11px;position:relative;z-index:2;flex-wrap:wrap}
.grille{
  flex:1 1 150px;min-width:130px;height:64px;border-radius:8px;
  background-color:var(--grille);
  background-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.75) 32%, rgba(255,255,255,.05) 34%, transparent 40%);
  background-size:7px 7px;
  border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 2px 9px rgba(0,0,0,.85);
  position:relative;
}
.grille .vu{
  position:absolute;left:0;right:0;bottom:0;height:100%;
  display:flex;align-items:flex-end;gap:3px;padding:7px 9px;opacity:0;transition:opacity .3s;
}
body.playing .grille .vu{opacity:1}
.grille .vu i{
  flex:1;background:linear-gradient(0deg,var(--ok),var(--warn));border-radius:2px;height:22%;
  animation:vu 1.1s ease-in-out infinite;
}
.grille .vu i:nth-child(2){animation-duration:.83s}
.grille .vu i:nth-child(3){animation-duration:1.34s}
.grille .vu i:nth-child(4){animation-duration:.72s}
.grille .vu i:nth-child(5){animation-duration:1.05s}
.grille .vu i:nth-child(6){animation-duration:.94s}
.grille .vu i:nth-child(7){animation-duration:1.22s}
.grille .vu i:nth-child(8){animation-duration:.66s}
@keyframes vu{0%,100%{height:14%}50%{height:84%}}

.tuner{
  flex:1 1 260px;min-width:220px;height:64px;border-radius:8px;
  background:linear-gradient(180deg,#E8DFC8,#CDBFA0);
  border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 3px 12px rgba(0,0,0,.42);
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  padding:0 12px;
}
html[data-theme="light"] .tuner{background:linear-gradient(180deg,#FBF6E9,#E4D9BE)}
.tuner .band{
  height:22px;position:relative;
  background:repeating-linear-gradient(90deg, rgba(60,45,25,.62) 0 1px, transparent 1px 11px);
  border-bottom:1px solid rgba(60,45,25,.35);
}
.tuner .band::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:6px;
  background:repeating-linear-gradient(90deg, rgba(60,45,25,.85) 0 1px, transparent 1px 55px);
}
.tuner .needle{
  position:absolute;top:0;bottom:26px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--dan),#8E1F18);
  box-shadow:0 0 9px var(--glow), 0 0 3px rgba(255,120,90,.9);
  transition:left .55s cubic-bezier(.3,.9,.3,1);left:6%;
}
.tuner .read{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:3px}
.tuner .freq{font:700 calc(15px * var(--ui))/1 ui-monospace,Consolas,monospace;color:#3A2A14;letter-spacing:.04em}
.tuner .nm{font-size:calc(12px * var(--ui));color:#4E3A20;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.tuner .lamp{
  width:9px;height:9px;border-radius:50%;background:#6B2A22;box-shadow:inset 0 0 3px rgba(0,0,0,.6);align-self:center;
}
body.playing .tuner .lamp{background:var(--dan);box-shadow:0 0 10px var(--glow),inset 0 0 2px #fff}

/* ---------- 导航 ---------- */
nav{
  display:flex;gap:6px;padding:9px 12px;overflow-x:auto;
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:7px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.03em;
  color:var(--tx2);border:1px solid transparent;min-height:var(--tap);
  display:inline-flex;align-items:center;
}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button:not(.on):hover{background:var(--card2);color:var(--tx)}

main{padding:14px 14px 22px;max-width:1080px;margin:0 auto}
@media(max-width:430px){
  nav{gap:4px;padding:8px 9px}
  nav button{padding:7px 6px;letter-spacing:.03em;font-size:calc(14px * var(--ui))}
  .shell{padding:11px 12px 10px}
  .grille{flex:0 0 66px;height:56px}
  .tuner{flex:1 1 auto;min-width:0;height:56px;padding:0 9px}
  .tuner .nm{max-width:50%}
  .tuner .freq{font-size:calc(13.5px * var(--ui))}
  #bar .volbox{margin-left:auto}
  #bar .now{flex:1 1 120px}
}

/* ---------- 通用 ---------- */
h2{font-size:calc(17px * var(--ui));margin:0 0 4px;letter-spacing:.06em}
h3{font-size:calc(15px * var(--ui));margin:18px 0 6px;color:var(--acc2)}
p{margin:7px 0;color:var(--tx2)}
.hint{font-size:calc(13px * var(--ui));color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chips{display:flex;gap:7px;margin:9px 0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;white-space:nowrap;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);min-height:var(--tap);
  display:inline-flex;align-items:center;gap:5px;
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .cn{opacity:.6;font-size:.86em}
.btn{
  padding:10px 16px;border-radius:9px;background:var(--acc);color:#fff;
  min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:#1B1C1F}
.btn.dan{background:var(--dan);color:#fff}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.st{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
  min-height:calc(72px * var(--ui));transition:border-color .18s,transform .12s;
}
.st:hover{border-color:var(--acc)}
.st:active{transform:scale(.985)}
.st.cur{border-color:var(--dan);background:var(--card2);box-shadow:0 0 0 1px var(--dan) inset}
.st .n{font-size:calc(15px * var(--ui));font-weight:600;line-height:1.35}
.st .m{font-size:calc(11.5px * var(--ui));color:var(--tx2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tagc{
  font-size:calc(10.5px * var(--ui));padding:1px 7px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);
}
.st.cur .tagc{background:rgba(226,104,95,.16);border-color:var(--dan);color:var(--dan)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.f{background:var(--dan)}
.dot.h{background:var(--warn)}

/* ---------- 底部播放条 ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,var(--card),var(--bg));
  border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.35);
}
#bar .wrap{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar .now{flex:1 1 190px;min-width:150px;overflow:hidden}
#bar .now .t{font-size:calc(14px * var(--ui));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .now .s{font-size:calc(11.5px * var(--ui));color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{
  width:52px;height:52px;min-width:52px;border-radius:50%;
  background:var(--dan);color:#fff;font-size:21px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.4);
}
.big:active{transform:scale(.95)}
.knob{
  width:46px;height:46px;min-width:46px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #55595F, #26282C 70%);
  border:1px solid #14161A;position:relative;
  box-shadow:0 2px 7px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
}
.knob::after{
  content:"";position:absolute;left:50%;top:5px;width:2px;height:13px;margin-left:-1px;
  background:var(--acc2);border-radius:2px;transform-origin:50% 18px;
  transform:rotate(var(--rot,0deg));transition:transform .2s;
}
.knob:active{filter:brightness(1.2)}
.volbox{display:flex;align-items:center;gap:7px}
.volmeter{width:56px;height:6px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.volmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn));width:60%;transition:width .2s}
#sleepBadge{
  font-size:calc(11.5px * var(--ui));color:var(--warn);border:1px dashed var(--warn);
  border-radius:7px;padding:4px 8px;white-space:nowrap;
}

/* ---------- 弹出面板 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:520px;max-height:88vh;overflow:auto;z-index:61;
  background:var(--card);border:1px solid var(--line);border-bottom:none;
  border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:none;
}
.sheet.on{display:block}
.sheet h3{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.seg button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);min-height:var(--tap)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stack{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card2)}
.lrow .g{flex:1;min-width:0}
.lrow .g .t{font-size:calc(14px * var(--ui));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .g .s{font-size:calc(11.5px * var(--ui));color:var(--tx2)}
input[type=text],input[type=url],textarea{
  width:100%;padding:10px 12px;border-radius:9px;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);font-family:inherit;font-size:calc(14px * var(--ui));min-height:var(--tap);
}
textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:calc(12.5px * var(--ui))}
label.f{display:block;font-size:calc(13px * var(--ui));color:var(--tx2);margin:11px 0 4px}
ol,ul{padding-left:1.3em;color:var(--tx2)}
li{margin:4px 0}
code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:.92em;color:var(--acc2)}
table{width:100%;border-collapse:collapse;margin:9px 0;font-size:calc(13.5px * var(--ui))}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--card2);color:var(--tx)}
.ft{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);color:var(--tx2);font-size:calc(12.5px * var(--ui));text-align:center}
.ft b{color:var(--tx);letter-spacing:.06em}
.qa{border-bottom:1px solid var(--line);padding:11px 0}
.qa:last-child{border-bottom:none}
.qa .q{font-weight:600;color:var(--tx);margin-bottom:3px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.qa .q .ar{color:var(--acc);flex:0 0 auto}
.qa .a{color:var(--tx2);display:none;padding-left:20px}
.qa.on .a{display:block}
.badge{display:inline-block;font-size:calc(11px * var(--ui));padding:1px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);margin-left:6px}
.warnbox{border-left:3px solid var(--warn);background:rgba(232,163,61,.08);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.danbox{border-left:3px solid var(--dan);background:rgba(226,104,95,.08);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.drop{
  border:1.5px dashed var(--line);border-radius:11px;padding:20px;text-align:center;color:var(--tx2);
  background:var(--card2);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.drop.over{border-color:var(--acc);color:var(--acc)}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* 窄屏网格覆盖 —— 必须放在样式表最末，否则被上面的基础 .stgrid 覆盖 */
@media(max-width:430px){
  .stgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
  .st{padding:10px 11px;min-height:calc(66px * var(--ui))}
  .st .n{font-size:calc(14.5px * var(--ui))}
}
/* ---------- 开屏海报 ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:#0B0806;display:flex;align-items:center;justify-content:center;
  opacity:1;transition:opacity .52s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
#splash img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
#splash.gone{opacity:0;pointer-events:none}
#splash.hide{display:none}
#splash .sp-tip{position:absolute;left:0;right:0;bottom:calc(20% + env(safe-area-inset-bottom));text-align:center;
  color:rgba(255,244,228,.88);font-size:calc(14px * var(--ui));letter-spacing:.2em;
  text-shadow:0 2px 12px rgba(0,0,0,.85);animation:spPulse 1.9s ease-in-out infinite;pointer-events:none}
#splash .sp-skip{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));
  padding:7px 15px;border-radius:999px;background:rgba(0,0,0,.44);border:1px solid rgba(255,255,255,.22);
  color:rgba(255,246,232,.85);font-size:calc(12.5px * var(--ui));font-family:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
#splash .sp-skip:hover{background:rgba(0,0,0,.6)}
@keyframes spPulse{0%,100%{opacity:.5}50%{opacity:1}}
html[data-motion="low"] #splash{transition:none}
html[data-motion="low"] #splash .sp-tip{animation:none;opacity:.9}
/* 搜索框 */
.qbox{display:flex;align-items:center;gap:9px;margin:11px 0 2px;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:0 11px}
.qbox .qi{opacity:.5;font-size:calc(17px * var(--ui));line-height:1}
.qbox input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--tx);
  font-size:calc(15px * var(--ui));padding:11px 0;font-family:inherit}
.qbox input::placeholder{color:var(--tx2);opacity:.75}
.qbox input::-webkit-search-cancel-button{display:none}
.qbox .qclear{background:transparent;border:0;color:var(--tx2);font-size:calc(14px * var(--ui));
  cursor:pointer;padding:8px;line-height:1;min-width:32px}
.qbox .qclear.hide{display:none}
</style>
</head>
<body>

    <button data-ui="1.05">大</button>
    <button data-ui="1.2">特大</button>
    <button data-ui="1.35">巨大</button>
  </div>
  <label class="f">按钮大小</label>
  <div class="seg" id="segTap">
    <button data-tap="38">普通</button>
    <button data-tap="48">大</button>
  </div>
  <label class="f">动效</label>
  <div class="seg" id="segMotion">
    <button data-mo="full">正常</button>
    <button data-mo="low">减弱</button>
  </div>
  <label class="f">定时关机（睡觉听戏用）</label>
  <div class="seg" id="segSleep">
    <button data-sl="0">不定时</button>
    <button data-sl="15">15 分</button>
    <button data-sl="30">30 分</button>
    <button data-sl="60">1 小时</button>
    <button data-sl="90">1.5 小时</button>
  </div>
  <label class="f">打开后自动续播上次的台</label>
  <div class="seg" id="segResume">
    <button data-rs="1">开</button>
    <button data-rs="0">关</button>
  </div>
  <label class="f">换台时自动跳过连不上的台</label>
  <div class="seg" id="segSkip">
    <button data-sk="1">开</button>
    <button data-sk="0">关</button>
  </div>
  <label class="f">打开时显示开屏海报</label>
  <div class="seg" id="segSplash">
    <button data-sp="every">每次</button>
    <button data-sp="once">只第一次</button>
    <button data-sp="off">不显示</button>
  </div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" id="btnExport">导出备份</button>
    <button class="btn ghost" id="btnImport">恢复备份</button>
    <button class="btn ghost" id="btnReset">清空数据</button>
  </div>
  <p class="hint" style="margin-top:10px">所有收藏、自建台、音量与设置都存在这台设备的浏览器里，不会上传到任何服务器。</p>
</div>

<input type="file" id="fileImportJson" accept=".json" style="display:none">
<input type="file" id="fileAudio" accept="audio/*" multiple style="display:none">
<input type="file" id="fileAudioDir" webkitdirectory directory multiple style="display:none">

var KEY='xixiazi.v1';                   // 键名固定，别改，改了老用户数据会丢
var S={
  theme:'dark', ui:1, tap:38, motion:'full',
  vol:0.7, sleepMin:0, resume:1, skip:1,
  cur:null, fav:[], custom:[], hist:[], lastCat:'全部',
  splash:'every',          /* every=每次打开都显示  once=只第一次  off=不显示 */
  splashSeen:false
};

function load(){
  try{
    var o=JSON.parse(localStorage.getItem(KEY)||'{}');
    for(var k in o){ if(o.hasOwnProperty(k)) S[k]=o[k]; }
  }catch(e){}
  if(S.fav==null) S.fav=[];
  if(S.custom==null) S.custom=[];
  if(S.hist==null) S.hist=[];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* 全部台 = 内置 + 自建 */
function allStations(){
  var a=STATIONS.slice();
  for(var i=0;i<S.custom.length;i++){
    var c=S.custom[i];
    a.unshift({n:c.n, u:c.u, c:c.c||'自建', custom:true});
  }
  return a;
}
function byUrl(u){
  var a=allStations();
  for(var i=0;i<a.length;i++){ if(a[i].u===u) return a[i]; }
  return null;
}
function isFav(u){ return S.fav.indexOf(u)>=0; }

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtSize(b){
  if(b==null) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
function fmtTime(s){
  if(!isFinite(s)||s<0) return '0:00';
  s=Math.floor(s);
  var m=Math.floor(s/60), ss=s%60;
  if(m<60) return m+':'+(ss<10?'0':'')+ss;
  return Math.floor(m/60)+':'+(m%60<10?'0':'')+(m%60)+':'+(ss<10?'0':'')+ss;
}

/* 搜索词（不持久化，重开即清） */
var Q='', QFOCUS=false;

/* 该 URL 是不是 HLS（m3u8） */
function isHls(u){ return /\.m3u8(\?|$)/i.test(u); }
/* 浏览器是否原生支持 HLS（Edge / Safari 支持；安卓 Chrome 不支持） */
var HLS_NATIVE=(function(){
  try{ return document.createElement('audio').canPlayType('application/vnd.apple.mpegurl')!==''; }
  catch(e){ return false; }
})();

/* 换台时试的线路变体：蜻蜓 CDN 有 lhttp / lhttp-hw 两套域名，去掉签名参数也能通 */
function variants(u){
  var out=[u];
  var noQ=u.replace(/\?.*$/,'');
  if(noQ!==u) out.push(noQ);
  if(u.indexOf('lhttp-hw.')>=0) out.push(u.replace('lhttp-hw.','lhttp.'));
  if(u.indexOf('lhttp.')>=0 && u.indexOf('lhttp-hw.')<0) out.push(u.replace('lhttp.','lhttp-hw.'));
  if(u.indexOf('https://')===0) out.push('http://'+u.slice(8));
  if(u.indexOf('http://')===0) out.push('https://'+u.slice(7));
  var uniq=[];
  for(var i=0;i<out.length;i++){ if(uniq.indexOf(out[i])<0) uniq.push(out[i]); }
  return uniq;
}

/* 手机锁屏 / 通知栏显示台名，支持耳机线控与锁屏按钮 */
function setMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    var art=[];
    var im=document.getElementById('spImg');
    if(im && im.src) art=[{src:im.src, sizes:'1080x1920', type:'image/jpeg'}];
    navigator.mediaSession.metadata=new MediaMetadata({
      title: P.name || '拾声',
      artist: (P.cat ? P.cat + ' · ' : '') + '拾声 XianDial',
      album: '拾声 · 网络收音机',
      artwork: art
    });
    navigator.mediaSession.setActionHandler('play', function(){ togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){
      try{ audio.pause(); }catch(e){} P.state='paused'; setNow(); render();
    });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ step(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ step(1); });
    navigator.mediaSession.setActionHandler('stop', function(){
      stopAudio(); P.state='idle'; P.url=null; setNow(); render();
    });
  }catch(e){}
}
function setNeedle(){
  var a=allStations(), i=0;
  for(var k=0;k<a.length;k++){ if(a[k].u===P.url){ i=k; break; } }
  var pct=a.length>1 ? (6+ (i/(a.length-1))*88) : 50;
  $('needle').style.left=pct.toFixed(2)+'%';
  $('tunerFreq').textContent=(88.0+(i%40)*0.45).toFixed(1)+' MHz';
}

/* ══ HLS 播放引擎 ══
   内嵌了 hls.js，所以安卓 Chrome 等不原生支持 HLS 的浏览器也能播 m3u8
   （央视/卫视伴音、部分省市台）。Edge / Safari 原生支持，走原路更快。*/
var hls=null;
function hlsStop(){
  if(hls){ try{ hls.destroy(); }catch(e){} hls=null; }
}
function hlsStart(url, onFail){
  if(typeof Hls==='undefined' || !Hls.isSupported()) return false;
  hlsStop();
  try{
    hls=new Hls({
      enableWorker:true, lowLatencyMode:false, backBufferLength:30,
      manifestLoadingTimeOut:9000, levelLoadingTimeOut:9000, fragLoadingTimeOut:14000,
      manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2, fragLoadingMaxRetry:3
    });
    hls.attachMedia(audio);
    hls.on(Hls.Events.MEDIA_ATTACHED, function(){ try{ hls.loadSource(url); }catch(e){ onFail(); } });
    hls.on(Hls.Events.ERROR, function(ev, d){ if(d && d.fatal) onFail(); });
    return true;
  }catch(e){ hlsStop(); return false; }
}
function stopAudio(){
  hlsStop();
  try{ audio.pause(); audio.removeAttribute('src'); audio.load(); }catch(e){}
}

function playStation(st, opts){
  opts=opts||{};
  if(!st) return;
  if(P.retryTimer){ clearTimeout(P.retryTimer); P.retryTimer=null; }
  if(isHls(st.u) && !HLS_NATIVE && typeof Hls==='undefined'){
    toast('这个台是 HLS 流，当前浏览器播不了。请换一个台，或用 Edge / Safari 打开。', 4200);
  }
  P.url=st.u; P.name=st.n; P.cat=st.c||'';
  P.vs=variants(st.u); P.vi=0; P.state='loading';
  S.cur={u:st.u, n:st.n, c:st.c||''};
  if(!opts.noSave) save();
  setNeedle(); setNow(); render();
  tryPlay();
  if(st.hist!==false) pushHist(st);
}

function tryPlay(){
  var url=P.vs[P.vi];
  if(!url){ P.state='error'; setNow(); toast('这个台连不上，换一个试试'); nextStation(); return; }
  stopAudio();
  audio.volume=S.vol;
  var viaHls=(isHls(url) && !HLS_NATIVE && hlsStart(url, fail));
  if(!viaHls){ audio.src=url; }
  var done=false;
  function fail(){
    if(done) return; done=true;
    audio.removeEventListener('error',onErr);
    P.vi++;
    if(P.vi<P.vs.length){ tryPlay(); }
    else{
      P.state='error'; setNow(); render();
      if(S.skip && P.failCount<4){ P.failCount++; P.retryTimer=setTimeout(function(){ nextStation(); }, 900); }
      else{ P.failCount=0; toast('这个台暂时连不上，声音可能已经断了，请换一个台'); }
    }
  }
  function onErr(){ fail(); }
  if(!viaHls){ audio.addEventListener('error', onErr, {once:true}); }
  var pr=audio.play();
  if(pr && pr.catch){ pr.catch(function(e){ if(e && e.name!=='AbortError') fail(); }); }
  setTimeout(function(){
    if(done) return;
    if(audio.readyState>=2){ done=true; audio.removeEventListener('error',onErr);
      P.state='playing'; P.failCount=0; setNow(); render(); }
  }, 1200);
}

audio.addEventListener('playing', function(){ P.state='playing'; P.failCount=0; setNow(); render(); });
audio.addEventListener('pause', function(){ if(P.state==='playing'){ P.state='paused'; setNow(); render(); } });
audio.addEventListener('stalled', function(){ if(P.state==='playing'){ $('nowS').textContent='信号有点弱，正在缓冲……'; } });

function togglePlay(){
  if(P.state==='playing'){ audio.pause(); P.state='paused'; setNow(); render(); return; }
  // 恢复了上次的台但还没接线（src 为空）：重新接一次
  if(P.state==='paused' && P.url && audio.src){
    audio.play().catch(function(){});
    P.state='playing'; setNow(); render(); return;
  }
  var a=allStations();
  var back=S.cur? byUrl(S.cur.u) : null;
  playStation(back || a[0]);
}

function step(d){
  var a=allStations();
  if(!a.length) return;
  var i=-1;
  for(var k=0;k<a.length;k++){ if(a[k].u===P.url){ i=k; break; } }
  if(i<0) i=0; else i=(i+d+a.length)%a.length;
  playStation(a[i]);
}
function nextStation(){ step(1); }
function prevStation(){ step(-1); }

/* 历史 */
function pushHist(st){
  S.hist=S.hist.filter(function(x){ return x.u!==st.u; });
  S.hist.unshift({u:st.u, n:st.n, c:st.c||'', t:Date.now()});
  if(S.hist.length>12) S.hist.length=12;
  save();
}

  S.sleepMin=min; save();

/* ══════════════════════════════════════════════════════
   五、拾藏（本地点播库 · IndexedDB）
   ══════════════════════════════════════════════════════ */
var DB=null;
function openDB(){
  return new Promise(function(res,rej){
    if(DB) return res(DB);
    var rq=indexedDB.open('xixiazi.media', 1);
    rq.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'id'});
      if(!db.objectStoreNames.contains('blob')) db.createObjectStore('blob', {keyPath:'id'});
    };
    rq.onsuccess=function(){ DB=rq.result; res(DB); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function idb(store, mode, fn){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store, mode), os=tx.objectStore(store);
      var r=fn(os);
      tx.oncomplete=function(){ res(r && r.result!==undefined ? r.result : r); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localList(){
  return idb('meta','readonly',function(os){ return os.getAll(); })
    .then(function(a){ return (a||[]).sort(function(x,y){ return (x.added||0)-(y.added||0); }); });
}
function localAdd(file, group){
  var id='m'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(['meta','blob'],'readwrite');
      tx.objectStore('blob').put({id:id, data:file});
      tx.objectStore('meta').put({id:id, n:file.name, sz:file.size, g:group||'',
                                  added:Date.now(), pos:0, dur:0});
      tx.oncomplete=function(){ res(id); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localMeta(id, patch){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('meta','readwrite'), os=tx.objectStore('meta');
      var g=os.get(id);
      g.onsuccess=function(){
        var m=g.result; if(!m) return res(null);
        for(var k in patch){ m[k]=patch[k]; }
        os.put(m); res(m);
      };
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localDel(id){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(['meta','blob'],'readwrite');
      tx.objectStore('meta').delete(id);
      tx.objectStore('blob').delete(id);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function localBlob(id){
  return idb('blob','readonly',function(os){ return os.get(id); })
    .then(function(r){ return r && r.data ? r.data : null; });
}

/* 本地播放 */
var LP={ id:null, url:null, dur:0, seeking:false, tick:null };
function localPlay(rec){
  if(!rec) return;
  localBlob(rec.id).then(function(blob){
    if(!blob){ toast('这个文件读不出来了，可能已损坏'); return; }
    if(LP.url) URL.revokeObjectURL(LP.url);
    LP.id=rec.id; LP.dur=rec.dur||0;
    LP.url=URL.createObjectURL(blob);
    if(P.retryTimer){ clearTimeout(P.retryTimer); P.retryTimer=null; }
    stopAudio();
    audio.src=LP.url;
    audio.volume=S.vol;
    P.url='local:'+rec.id; P.name=rec.n; P.cat='拾藏'; P.state='loading';
    S.cur={u:P.url, n:rec.n, c:'拾藏'}; save();
    setNow(); render();
    audio.addEventListener('loadedmetadata', function once(){
      audio.removeEventListener('loadedmetadata', once);
      LP.dur=audio.duration||0;
      localMeta(rec.id, {dur:LP.dur});
      if(rec.pos>1) audio.currentTime=Math.min(rec.pos, LP.dur-1);
    });
    var pr=audio.play();
    if(pr&&pr.catch) pr.catch(function(){});
  });
}
/* 断点续播：每 4 秒写一次进度 */
audio.addEventListener('timeupdate', function(){
  if(!LP.id || LP.seeking) return;
  var t=audio.currentTime;
  if(!LP.tick || Date.now()-LP.tick>4000){
    LP.tick=Date.now();
    localMeta(LP.id, {pos:t, dur:audio.duration||LP.dur||0});
  }
});
function flushLocalPos(){
  if(LP.id && audio.currentTime>0){ localMeta(LP.id, {pos:audio.currentTime}); }
}
document.addEventListener('visibilitychange', function(){ if(document.hidden) flushLocalPos(); });
window.addEventListener('beforeunload', flushLocalPos);

           (m.pos>3?(' · 上次听到 '+esc(fmtTime(m.pos))):'')+
           (m.g?(' · '+esc(m.g)):'')+'</div></div>'+
         '<button class="btn ghost" data-lp="'+esc(m.id)+'">'+(cur&&P.state==='playing'?'暂停':'收听')+'</button>'+
         '<button class="btn ghost" data-ld="'+esc(m.id)+'" title="倒掉">倒掉</button>'+
         '</div>';
    }
    box.innerHTML=h;
  }).catch(function(){});
}

function importFiles(files){
  if(!files || !files.length) return;
  var arr=[], total=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>0 && (/\.(mp3|m4a|aac|ogg|opus|wav|flac|wma|mp4|m3u8|ts)$/i.test(f.name) || (f.type||'').indexOf('audio')===0)){
      arr.push(f); total+=f.size;
    }
  }
  if(!arr.length){ toast('没找到能听的音频文件'); return; }
  var bar=$('impBar'), fill=$('impFill'), txt=$('impTxt');
  if(bar){ bar.style.display=''; fill.style.width='0%'; }
  if(txt) txt.textContent='准备收进来：'+arr.length+' 个文件，共 '+fmtSize(total);
  var done=0;
  (function next(){
    if(done>=arr.length){
      if(fill) fill.style.width='100%';
      if(txt) txt.textContent='放好了：'+arr.length+' 个文件。往下看，已经收进来了。';
      toast('放进去了 '+arr.length+' 个');
      setTimeout(function(){ if(bar) bar.style.display='none'; }, 1600);
      refreshLocal();
      return;
    }
    var f=arr[done];
    var g=(f.webkitRelativePath||'').split('/')[0] || '';
    localAdd(f, g).then(function(){
      done++;
      if(fill) fill.style.width=((done/arr.length)*100).toFixed(0)+'%';
      if(txt) txt.textContent='放进去了 '+done+' / '+arr.length+'：'+f.name;
      next();
    }).catch(function(){
      done++;
      if(txt) txt.textContent='有一个没放进去：'+f.name;
      next();
    });
  })();
}

/* ══════════════════════════════════════════════════════
   八、设置 / 主题
   ══════════════════════════════════════════════════════ */
function applyTheme(){
  var t=S.theme;
  if(t==='system'){
    t=(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var mc=document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute('content', t==='dark'?'#1B1C1F':'#F2F3F5');
}
function applyAll(){
  applyTheme();
  document.documentElement.style.setProperty('--ui', S.ui);
  document.documentElement.style.setProperty('--tap', S.tap+'px');
  document.documentElement.setAttribute('data-motion', S.motion==='low'?'low':'full');
  syncSeg('segTheme','data-th',S.theme);
  syncSeg('segUi','data-ui',String(S.ui));
  syncSeg('segTap','data-tap',String(S.tap));
  syncSeg('segMotion','data-mo',S.motion);
  syncSeg('segSleep','data-sl',String(S.sleepMin));
  syncSeg('segResume','data-rs',String(S.resume));
  syncSeg('segSkip','data-sk',String(S.skip));
  syncSeg('segSplash','data-sp',S.splash||'every');
}
function syncSeg(id, attr, val){
  var box=$(id); if(!box) return;
  var bs=box.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){
    bs[i].classList.toggle('on', String(bs[i].getAttribute(attr))===String(val));
  }
}
function openSheet(v){ $('sheet').classList.toggle('on', v); $('mask').classList.toggle('on', v); }

/* 导出 / 导入 */
function exportJSON(){
  var data={app:'xixiazi', v:1, t:Date.now(), s:S};
  var blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date();
  a.href=url;
  a.download='xixiazi-backup-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast('备份已经下载了');
}
function importJSON(text){
  var o;
  try{ o=JSON.parse(text); }catch(e){ toast('这个文件读不出来，不是备份文件？'); return; }
  var s=(o && o.app==='xixiazi' && o.s) ? o.s : (o && o.vol!=null ? o : null);
  if(!s){ toast('这不是拾声的备份文件'); return; }
  for(var k in s){ if(s.hasOwnProperty(k)) S[k]=s[k]; }
  save(); applyAll(); setVol(S.vol);
  if(S.sleepMin) setSleep(S.sleepMin);
  render();
  toast('备份恢复好了');
}

/* ══════════════════════════════════════════════════════
   九、事件
   ══════════════════════════════════════════════════════ */
var NEWCAT=null;
var LONGPRESSED=false;

/* 向上找带某属性的祖先（点卡片里的文字也能命中卡片本身） */
function closestAttr(el, attr){
  while(el && el!==document.body){
    if(el.getAttribute && el.getAttribute(attr)!=null) return el;
    el=el.parentNode;
  }
  return null;
}

document.addEventListener('input', function(e){
  var t=e.target;
  if(t && t.id==='qInput'){ Q=t.value; QFOCUS=true; render(); }
});
document.addEventListener('focusin', function(e){
  if(e.target && e.target.id==='qInput') QFOCUS=true;
});
document.addEventListener('focusout', function(e){
  if(e.target && e.target.id==='qInput'){
    setTimeout(function(){
      var q=document.getElementById('qInput');
      if(document.activeElement!==q) QFOCUS=false;
    }, 160);
  }
});

document.addEventListener('click', function(e){
  var el;

  // 导航
  el=closestAttr(e.target,'data-v');
  if(el){ VIEW=el.getAttribute('data-v'); window.scrollTo(0,0); render(); return; }

  // 选台
  el=closestAttr(e.target,'data-i');
  if(el && el.classList && el.classList.contains('st')){
    if(LONGPRESSED){ LONGPRESSED=false; return; }
    var a=allStations(), st=a[parseInt(el.getAttribute('data-i'),10)];
    if(!st) return;
    if(P.url===st.u && P.state==='playing'){ audio.pause(); P.state='paused'; setNow(); render(); return; }
    if(P.url===st.u && P.state==='paused'){ audio.play().catch(function(){}); P.state='playing'; setNow(); render(); return; }
    playStation(st);
    return;
  }

  // 分类筛选
  el=closestAttr(e.target,'data-qclear');
  if(el){ Q=''; QFOCUS=true; render(); return; }
  el=closestAttr(e.target,'data-cat');
  if(el){ S.lastCat=el.getAttribute('data-cat'); save(); render(); return; }

  // 最近听过
  el=closestAttr(e.target,'data-hist');
  if(el){
    var su=el.getAttribute('data-hist'), s2=byUrl(su);
    if(s2) playStation(s2); else toast('这个台已经不在清单里了');
    return;
  }

  // 自建台归到哪一类
  el=closestAttr(e.target,'data-newcat');
  if(el){
    NEWCAT=el.getAttribute('data-newcat');
    var bh=$('addHint'); if(bh) bh.textContent='归到「'+NEWCAT+'」';
    var box0=el.parentNode, chips=box0.querySelectorAll('.chip');
    for(var z=0;z<chips.length;z++){ chips[z].classList.toggle('on', chips[z]===el); }
    return;
  }

  // 常见问题折叠
  el=closestAttr(e.target,'data-qa');
  if(el){
    var box=el.closest ? el.closest('.qa') : el.parentNode;
    if(box && box.classList.contains('qa')) box.classList.toggle('on');
    return;
  }

  // 拾藏 · 播放 / 倒掉
  el=closestAttr(e.target,'data-lp');
  if(el){
    var lp=el.getAttribute('data-lp');
    if(P.url==='local:'+lp && P.state==='playing'){
      flushLocalPos(); audio.pause(); P.state='paused'; setNow(); render(); return;
    }
    if(P.url==='local:'+lp && P.state==='paused'){
      audio.play().catch(function(){}); P.state='playing'; setNow(); render(); return;
    }
    var rec=null;
    for(var m=0;m<LOCALS.length;m++){ if(LOCALS[m].id===lp){ rec=LOCALS[m]; break; } }
    if(rec) localPlay(rec); else toast('读不到这一条');
    return;
  }
  el=closestAttr(e.target,'data-ld');
  if(el){
    var ld=el.getAttribute('data-ld');
    if(!window.confirm('这一条会倒掉，本机上的原文件不受影响。确定？')) return;
    localDel(ld).then(function(){
      if(P.url==='local:'+ld){ stopAudio(); P.url=null; P.state='idle'; setNow(); }
      refreshLocal(); toast('倒掉了');
    });
    return;
  }
});

/* 长按 / 双击收藏 */
var pressTimer=null;
document.addEventListener('pointerdown', function(e){
  var el=closestAttr(e.target,'data-i');
  if(el && el.classList && el.classList.contains('st')){
    var a=allStations(), st=a[parseInt(el.getAttribute('data-i'),10)];
    if(!st) return;
    pressTimer=setTimeout(function(){
      pressTimer=null;
      LONGPRESSED=true;                 // 抑制随后的 click，别又播一遍
      toggleFav(st.u);
      setTimeout(function(){ LONGPRESSED=false; }, 900);
    }, 620);
  }
});
['pointerup','pointercancel','pointermove','scroll'].forEach(function(ev){
  document.addEventListener(ev, function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }, true);
});

function toggleFav(u){
  var i=S.fav.indexOf(u);
  if(i>=0){ S.fav.splice(i,1); toast('从常听里拿出去了'); }
  else{ S.fav.push(u); toast('收进「常听的台」了'); }
  save(); render();
}

/* 播放条 */
$('btnPlay').addEventListener('click', togglePlay);
$('knobPrev').addEventListener('click', prevStation);
$('knobNext').addEventListener('click', nextStation);
$('btnVolUp').addEventListener('click', function(){ setVol(S.vol+0.1); });
$('btnVolDown').addEventListener('click', function(){ setVol(S.vol-0.1); });
$('btnGear').addEventListener('click', function(){ applyAll(); openSheet(true); });
$('mask').addEventListener('click', function(){ openSheet(false); });

/* 设置面板里的分段控件 */
document.addEventListener('click', function(e){
  var t=e.target;
  if(!t.getAttribute) return;
  var th=t.getAttribute('data-th'); if(th){ S.theme=th; save(); applyAll(); return; }
  var ui=t.getAttribute('data-ui'); if(ui){ S.ui=parseFloat(ui); save(); applyAll(); return; }
  var tp=t.getAttribute('data-tap'); if(tp){ S.tap=parseInt(tp,10); save(); applyAll(); return; }
  var mo=t.getAttribute('data-mo'); if(mo){ S.motion=mo; save(); applyAll(); return; }
  var sl=t.getAttribute('data-sl'); if(sl){ setSleep(parseInt(sl,10)); applyAll(); toast(sl==='0'?'不定时了':('到点自动关机：'+sl+' 分钟')); return; }
  var rs=t.getAttribute('data-rs'); if(rs){ S.resume=parseInt(rs,10); save(); applyAll(); return; }
  var sk=t.getAttribute('data-sk'); if(sk){ S.skip=parseInt(sk,10); save(); applyAll(); return; }
  var sp=t.getAttribute('data-sp'); if(sp){ S.splash=sp; save(); applyAll();
    toast(sp==='off'?'不再显示开屏海报':(sp==='once'?'只在第一次打开时显示':'每次打开都显示')); return; }
});

/* 加自建台 */
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnAddSt') return;
  var n=($('inName')||{}).value||'', u=($('inUrl')||{}).value||'';
  n=n.trim(); u=u.trim();
  if(!n){ toast('先给这个台起个名字'); return; }
  if(!/^https?:\/\//i.test(u)){ toast('地址要以 http:// 或 https:// 开头'); return; }
  for(var i=0;i<S.custom.length;i++){ if(S.custom[i].u===u){ toast('这个地址已经收进来了'); return; } }
  S.custom.unshift({n:n, u:u, c:NEWCAT||'自建'});
  save(); toast('加进去了：'+n);
  NEWCAT=null; render();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnExport') return;
  exportJSON();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnImport') return;
  $('fileImportJson').click();
});
document.addEventListener('click', function(e){
  if(!e.target || e.target.id!=='btnReset') return;
  if(!window.confirm('会清掉收藏、自建台和所有设置（「拾藏」里的音频要单独倒）。确定？')) return;
  localStorage.removeItem(KEY);
  location.reload();
});
$('fileImportJson').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ importJSON(String(r.result)); };
  r.readAsText(f);
  e.target.value='';
});

/* 拾藏按钮 */
document.addEventListener('click', function(e){
  var id=e.target && e.target.id;
  if(id==='btnPickAudio') $('fileAudio').click();
  else if(id==='btnPickDir') $('fileAudioDir').click();
  else if(id==='btnLocalShuffle'){
    if(!LOCALS.length){ toast('还没拾到东西'); return; }
    localPlay(LOCALS[Math.floor(Math.random()*LOCALS.length)]);
  }
  else if(id==='btnLocalClear'){
    if(!LOCALS.length){ toast('本来就是空的'); return; }
    if(!window.confirm('「拾藏」里的 '+LOCALS.length+' 条会全部倒掉，本机原文件不受影响。确定？')) return;
    var ids=LOCALS.map(function(x){ return x.id; });
    Promise.all(ids.map(localDel)).then(function(){
      if(P.url && P.url.indexOf('local:')===0){ stopAudio(); P.url=null; P.state='idle'; setNow(); }
      refreshLocal(); toast('倒干净了');
    });
  }
});
$('fileAudio').addEventListener('change', function(e){ importFiles(e.target.files); e.target.value=''; });
$('fileAudioDir').addEventListener('change', function(e){ importFiles(e.target.files); e.target.value=''; });

/* 拖拽进拾藏 */
document.addEventListener('dragover', function(e){
  var d=$('drop'); if(!d) return;
  e.preventDefault(); d.classList.add('over');
});
document.addEventListener('dragleave', function(e){
  var d=$('drop'); if(d) d.classList.remove('over');
});
document.addEventListener('drop', function(e){
  var d=$('drop'); if(!d) return;
  e.preventDefault(); d.classList.remove('over');
  if(e.dataTransfer && e.dataTransfer.files) importFiles(e.dataTransfer.files);
});

/* 键盘：空格开关，左右换台 */
document.addEventListener('keydown', function(e){
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code==='ArrowRight'){ nextStation(); }
  else if(e.code==='ArrowLeft'){ prevStation(); }
});

/* 系统主题变化 */
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    if(S.theme==='system') applyTheme();
  });
}catch(e){}

/* ══════════════════════════════════════════════════════
   九·五、开屏海报
   ══════════════════════════════════════════════════════ */
var SPLASH_SKIP=false, SPLASH_TIMER=null, SPLASH_DONE=false;
try{
  if(String(location.search||'').indexOf('in=1')>=0){
    SPLASH_SKIP=true;
    if(history.replaceState) history.replaceState(null,'',location.pathname+(location.hash||''));
  }
}catch(e){}

function splashShouldShow(){
  if(SPLASH_SKIP) return false;
  if(S.splash==='off') return false;
  if(S.splash==='once' && S.splashSeen) return false;
  return true;
}
function splashOut(){
  var el=$('splash'); if(!el || SPLASH_DONE) return;
  SPLASH_DONE=true;
  if(SPLASH_TIMER){ clearTimeout(SPLASH_TIMER); SPLASH_TIMER=null; }
  S.splashSeen=true; save();
  if(S.motion==='low'){ el.classList.add('hide'); return; }
  el.classList.add('gone');
  setTimeout(function(){ el.classList.add('hide'); }, 560);
}
function bootSplash(){
  var el=$('splash'); if(!el) return;
  if(!splashShouldShow()){ el.classList.add('hide'); return; }
  el.addEventListener('click', splashOut);
  var img=$('splashImg');
  function begin(){ SPLASH_TIMER=setTimeout(splashOut, 2800); }
  if(img && img.decode){ img.decode()['then'](begin)['catch'](begin); } else { begin(); }
}

/* ══════════════════════════════════════════════════════
   十、启动
   ══════════════════════════════════════════════════════ */
(function boot(){
  load();
  applyAll();
  setVol(S.vol);
  if(S.sleepMin) setSleep(S.sleepMin);
  if(S.resume && S.cur && S.cur.u){
    var back=byUrl(S.cur.u);
    P.url=S.cur.u; P.name=S.cur.n; P.cat=S.cur.c||'';
    P.vs=variants(S.cur.u); P.vi=0; P.state='paused';
    if(back && back.n){ P.name=back.n; P.cat=back.c||P.cat; }
  }
  VIEW='radio';
  render();
  setNow();
  if(P.url) setNeedle();
  bootSplash();
})();
</script>
